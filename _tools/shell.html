<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover,shrink-to-fit=no">
<title>篮球经理</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#151b24">
<meta name="apple-mobile-web-app-title" content="篮球经理">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0d1117; --bg2:#151b24; --bg3:#1c2430; --line:#2a3441;
  --txt:#e6edf3; --dim:#8b98a8; --dim2:#5f6b7a;
  --acc:#ff8a1f; --acc2:#c9620a; --warn:#f0a020; --bad:#e5484d; --good:#00c276; --info:#4a9eff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{overflow-x:hidden;max-width:100%;background:var(--bg2);-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:pan-x pan-y}
body{background:var(--bg2);color:var(--txt);font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(255,138,31,.18)}
input,select{-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#333d4b;border-radius:5px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:calc(52px + var(--sat));flex:0 0 calc(52px + var(--sat));background:linear-gradient(180deg,#1b2430,#141b24);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:var(--sat) calc(14px + var(--sar)) 0 calc(14px + var(--sal))}
#tb-name{font-weight:700;font-size:14px;line-height:1.15}#tb-name small{display:block;font-weight:400;font-size:11px;color:var(--dim)}
#tb-spacer{flex:1}#tb-stats{display:flex}
.tb-stat{text-align:center;padding:0 10px;border-left:1px solid var(--line);min-width:70px}.tb-stat b{display:block;font-size:13px}.tb-stat span{font-size:10px;color:var(--dim)}
#main{flex:1;display:flex;min-height:0;background:var(--bg)}
#side{width:calc(150px + var(--sal));flex:0 0 calc(150px + var(--sal));background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:6px 0 var(--sab) var(--sal)}
.nav{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;color:var(--dim);border-left:3px solid transparent;font-size:13px}
.nav:hover{background:var(--bg3);color:var(--txt)}.nav.on{background:var(--bg3);color:var(--acc);border-left-color:var(--acc);font-weight:600}
.nav svg{width:16px;height:16px;flex:0 0 16px}
#view{flex:1;min-width:0;overflow-y:auto;padding:16px calc(18px + var(--sar)) calc(40px + var(--sab)) 18px}
@media(min-width:1500px){#view>*{max-width:1380px;margin-left:auto;margin-right:auto}}
h1{font-size:19px;font-weight:700;margin-bottom:3px}h2{font-size:15px;margin:16px 0 8px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card>h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card>h3 .r{margin-left:auto;font-weight:400;color:var(--dim);font-size:12px}
.row{display:flex;gap:14px;flex-wrap:wrap}.col{flex:1;min-width:0}
.tw{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 7px;border-bottom:1px solid #1f2733;white-space:nowrap}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--bg3)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
button{font:inherit;background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer}
button:hover{border-color:#3c4a5c}button.pri{background:var(--acc);border-color:var(--acc);color:#1a0f00;font-weight:700}
button.pri:hover{background:#ff9a3c}button.sm{padding:4px 9px;font-size:12px}button:disabled{opacity:.4;cursor:default}
button.on{border-color:var(--acc);color:var(--acc);background:#2a1c10}
select,input[type=number]{font:inherit;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
input[type=number]{width:58px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);background:var(--bg)}
.seg button:last-child{border-right:0}.seg button.on{background:#2a1c10;color:var(--acc)}
.pill{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;font-weight:700;line-height:18px}
.hint{color:var(--dim);font-size:12px}
.logo{display:inline-block;background-image:url(logos.png);background-size:600% 500%;background-repeat:no-repeat;vertical-align:middle;flex:0 0 auto}
.ovr{display:inline-block;min-width:28px;text-align:center;border-radius:4px;font-weight:700;font-size:12px;padding:0 4px;color:#111}
.bar{height:5px;background:#26303c;border-radius:3px;overflow:hidden;min-width:40px}.bar i{display:block;height:100%}
/* 选队 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.tcard:hover{border-color:var(--acc)}.tcard b{display:block;font-size:13px}.tcard span{font-size:11px;color:var(--dim)}
/* 球员详情 */
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px}
.attr{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed #222b36}
/* 比赛 */
#scoreboard{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px;background:linear-gradient(180deg,#1b2430,#121820);border-radius:8px 8px 0 0}
#scoreboard .tn{font-weight:700;font-size:15px;min-width:90px}#scoreboard .tn.a{text-align:right}
#scoreboard .sc{white-space:nowrap;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px;min-width:120px;text-align:center}
#sbinfo{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--dim);padding:5px;background:#121820;border-radius:0 0 8px 8px;border-top:1px solid var(--line)}
#sbinfo b{color:var(--txt)}
#courtwrap{position:relative;margin-top:10px}#court{width:100%;display:block;border-radius:6px;background:#1a1410}
#pbp{max-height:430px;overflow-y:auto;font-size:13px}
#pbp div{padding:5px 8px;border-bottom:1px solid #1f2733;display:flex;gap:8px}
#pbp div .t{color:var(--dim2);font-variant-numeric:tabular-nums;flex:0 0 64px;font-size:12px}
#pbp div.sc{background:#161d27}#pbp div.q{color:var(--acc);font-weight:700;justify-content:center}
.ctrl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal>.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto}
.selrow{cursor:pointer}.selrow.sel td{background:#2a1c10}
.fitbar{display:flex;align-items:center;gap:6px}
.syscard{border:1px solid var(--line);border-radius:7px;padding:9px 10px;cursor:pointer;background:var(--bg)}
.syscard.on{border-color:var(--acc);background:#2a1c10}.syscard b{font-size:13px}.syscard p{font-size:11px;color:var(--dim);margin-top:2px}
.sysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.short{display:none}.seg{justify-self:start}
.warn{color:var(--warn)}.bad{color:var(--bad)}.good{color:var(--good)}
/* ---- UI 审计（2026-09-30）：字号整体上调一档，进度条拉长，表格首列可换行 ---- */
body{font-size:14px}
h1{font-size:20px}.sub{font-size:13px;line-height:1.55}
.card>h3{font-size:14px}.card>h3 .r{font-size:12.5px}
table{font-size:13px}th{font-size:12px}
.hint{font-size:12.5px;line-height:1.55}
.pill{font-size:11.5px}.ovr{font-size:12.5px;min-width:30px}
.attr{font-size:13px}.tcard b{font-size:14px}.tcard span{font-size:12px}
.nav{font-size:14px}
button.sm{padding:5px 10px;font-size:12.5px}
.fitbar .bar{flex:1;max-width:280px;height:6px}
td.wrap{white-space:normal;min-width:120px}
.mshort{display:none}
.offitem{display:block;margin-bottom:4px}.offitem .hint{display:block}
@media(max-width:760px){
  #main{flex-direction:column-reverse}
  #side{width:100%;flex:0 0 auto;display:grid;grid-template-columns:repeat(var(--navcols,9),minmax(0,1fr));border-right:0;border-top:1px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal);overflow:visible}
  .nav{min-width:0;overflow:hidden;white-space:nowrap;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 0 5px;border-left:0;border-top:2px solid transparent;justify-content:center;letter-spacing:-.3px}
  .nav span{max-width:100%;overflow:hidden;text-overflow:clip}
  .nav svg{width:17px;height:17px;flex:0 0 17px}
  .nav.on{border-top-color:var(--acc)}
  #view{padding:14px 12px}
  /* 手机：按钮和输入框加高到手指好点的尺寸；输入框 16px，避免 iPhone 聚焦时自动放大 */
  button{min-height:40px;padding:8px 14px}
  button.sm{min-height:34px;padding:6px 11px;font-size:13px}
  select,input[type=number]{font-size:16px;min-height:38px;padding:6px 8px}
  input[type=number]{width:72px}
  input[type=checkbox]{width:20px;height:20px;vertical-align:middle}
  .mfull{display:none}.mshort{display:inline}
  .advgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.advgrid button{width:100%}.advgrid label{grid-column:1/-1}
  .pmhead{flex-wrap:wrap}.pmhead>div:last-child{margin-left:0!important;text-align:left!important;width:100%}
  .card{padding:13px}
  .modal{padding:10px}.modal>.box{padding:14px;max-height:92%}
  .tb-stat{display:none}
  #scoreboard .tn{min-width:0;font-size:13px}#scoreboard .sc{font-size:24px;min-width:90px}
  #scoreboard .full{display:none}#scoreboard .short{display:inline}#scoreboard{gap:8px}#sbinfo{gap:10px}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar"><span id="tb-logo"></span><div id="tb-name">篮球经理<small>2026-27 赛季</small></div><div id="tb-spacer"></div><div id="tb-stats"></div></div>
  <div id="main"><div id="side"></div><div id="view"></div></div>
</div>
<div id="modal"></div>
<script>
/*DATA*/
</script>
<script>
/*ENGINE*/
</script>
<script>
/*APP*/
</script>
</body>
</html>
