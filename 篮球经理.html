  const pool=non.map((i,k)=>({i,w:LOTTO[k]})), top=[];
  for(let k=0;k<4;k++){ let r=rnd01()*pool.reduce((s,x)=>s+x.w,0); const j=pool.findIndex(x=>(r-=x.w)<=0); top.push(pool[j].i); pool.splice(j,1); }
  const r1=[...top, ...pool.map(x=>x.i), ...po];
  resolveProtections(year, r1);
  const r2=[...non, ...po];
  const order=[]; r1.forEach((orig,k)=>order.push({no:k+1,round:1,orig,owner:W.picks[year][1][orig]}));
  r2.forEach((orig,k)=>order.push({no:31+k,round:2,orig,owner:W.picks[year][2][orig]}));
  return {year, order, lotto:non.map((i,k)=>({i,seedPos:k+1,got:r1.indexOf(i)+1}))};
}

// ---------- 4. 选秀 ----------
function rookieScale(no){ const C=CFG(W.off.year); if(no>30) return C.minSal; return Math.round((250+(1300-250)*Math.pow((30-no)/29,1.6))*capMul(W.off.year)); }
function aiDraftPick(ti){
  const cls=W.draftClass.filter(p=>!p.drafted);
  const t=TEAMS[ti]; const posCnt=p=>t.players.filter(x=>x.pos===p.pos).length;
  let best=null,bs=-1e9;
  cls.forEach(p=>{ const s=perceivedBy(p,ti)-posCnt(p)*.4+gauss(0,1.2); if(s>bs){bs=s;best=p;} });
  return best;
}
function draftPlayer(pk, p){
  const D=W.off.draft, yr=W.off.year;
  p.drafted=true; p.draft={year:D.year,round:pk.round,no:pk.no,team:pk.owner};
  const t=TEAMS[pk.owner];
  if(pk.round===1){ p.contract=[rookieScale(pk.no), yr+2, 'rk']; p.rkOpt=2; p.rk1=true; }
  else if(t.players.filter(x=>x.contract&&x.contract[2]==='tw').length<3){ p.contract=[Math.round(CFG(yr).minSal*.5), yr+2, 'tw']; p.rkOpt=0; p.rk1=false; }
  else { p.contract=[CFG(yr).minSal, yr+2, 'rk']; p.rkOpt=0; p.rk1=false; }
  t.players.push(p); PBYID[p.id]=p; chemHit(pk.owner,.25); D.log.push({no:pk.no, round:pk.round, team:pk.owner, pid:p.id});
}
function draftAdvance(untilUser){ // 一直选到轮到玩家（或者选完）
  const D=W.off.draft;
  while(D.idx<D.order.length){
    const pk=D.order[D.idx];
    if(pk.owner===G.team && untilUser){ maybeDraftOffer(pk); return; }
    const p=aiDraftPick(pk.owner); if(!p) break;
    draftPlayer(pk,p); D.idx++;
  }
  if(D.idx>=D.order.length) finishDraft();
}
function finishDraft(){
  const D=W.off.draft; if(D.done) return; D.done=true;
  // 没被选中的进自由市场
  W.draftClass.filter(p=>!p.drafted).forEach(p=>{ p.contract=null; FREE.push(p); });
  W.draftClass=[]; reindex();
}

// ---------- 5. 续约 ----------
function moodOf(p, ti){
  const S=G.season, q=S.ps[p.id], f=S.final.find(x=>x.i===ti);
  const mpg=q&&q.g? q.min/q.g : 0, wp=f? f.w/82 : .5;
  return clamp((1.25 - .2*clamp(mpg/30,0,1) - .15*wp)*(1+(60-mor(p))*.004), .9, 1.35);
}
function expiringOf(ti){ const yr=W.off.year; return TEAMS[ti].players.filter(p=>p.contract && p.contract[1]<=yr); }
// 到期类型：option 球队选项 / rfa 可发资格报价 / ufa 普通到期
function expType(p){ const c=p.contract; if(c && c[2]==='rk' && p.rkOpt>0) return 'option';
  if(c && c[2]==='rk' && p.rk1!==false && ageOf(p,W.off.year)<=25) return 'rfa'; return 'ufa'; }
function qoAmt(p){ return Math.max(Math.round(p.contract[0]*1.25), CFG(W.off.year).minSal*2); }
function exerciseOption(p){ p.contract=[Math.round(p.contract[0]*1.05), p.contract[1]+1, 'rk']; p.rkOpt--; }
function giveQO(p, ti, ask){ const qo=qoAmt(p); releaseToFA(p, ti, ask); p.rfa={team:ti, qo}; }
function signDirect(p, ti, amt, yrs, yr){ // 不受工资帽限制（伯德权、匹配报价单、资格报价）
  const i=FREE.indexOf(p); if(i>=0) FREE.splice(i,1);
  p.contract=[amt, yr+yrs, 'std']; delete p.fa; delete p.rfa; delete p.sheet; if(!TEAMS[ti].players.includes(p)){ TEAMS[ti].players.push(p); chemHit(ti,1); } PBYID[p.id]=p; TEAMS[ti]._rot=null; }
function makeAsk(p, ti){ const yr=W.off.year, age=ageOf(p,yr); return {amt:Math.round(marketSalary(p.ovr,age,yr)*moodOf(p,ti)), yrs:contractYears(age), mood:moodOf(p,ti), refuse:mor(p)<25||!!p.treq}; }
function playerValue(p, mode, year){ // 交易和续约通用的价值
  year=year||W.year; const age=ageOf(p,year);
  let eff=p.ovr; if(mode==='rebuild' && age<=24) eff=p.ovr+(p.pot-p.ovr)*.6; else if(age<=22) eff=p.ovr+(p.pot-p.ovr)*.25;
  let v=Math.pow(Math.max(0,eff-58),2.2);
  if(age>=31) v*=Math.max(.35, 1-(mode==='rebuild'?.1:.05)*(age-30));
  if(p.contract){ const yrs=Math.max(1,p.contract[1]-year); const surplus=(marketSalary(p.ovr,age,year)-p.contract[0])*yrs; v+=surplus*.06; }
  return v;
}
function teamMode(ti){ const rank=TEAMS.slice().sort((a,b)=>b.top8-a.top8).findIndex(t=>t.i===ti); return rank<12?'contend':'rebuild'; }
function aiResign(ti){
  const yr=W.off.year, C=CFG(yr), t=TEAMS[ti];
  expiringOf(ti).sort((a,b)=>b.ovr-a.ovr).forEach(p=>{
    const ask=makeAsk(p,ti); const worth=marketSalary(p.ovr,ageOf(p,yr),yr);
    const et=expType(p);
    if(et==='option'){ if(p.ovr>=66||p.pot>=78) exerciseOption(p); else releaseToFA(p,ti,ask); return; }
    if(et==='rfa'){ if(p.ovr>=68||p.pot>=80) giveQO(p,ti,ask); else releaseToFA(p,ti,ask); return; }
    const keep = !ask.refuse && t.players.filter(x=>x.contract && x.contract[1]>yr).length < 15 && ownerOk(ti,ask.amt,yr) && payroll(t,yr)+ask.amt <= C.apron2*1.08 && (ask.amt<=worth*1.12) && p.ovr>=66 && rnd01()<.8;
    if(keep){ const old=p.contract[0]; p.contract=[ask.amt, yr+ask.yrs, 'std']; if(ask.amt>old*1.2) freezeOnSign(p); } else releaseToFA(p, ti, ask);
  });
}
function releaseToFA(p, ti, ask){
  const t=TEAMS[ti]; t.players=t.players.filter(x=>x!==p); p.contract=null;
  const yr=W.off.year; const a=ask||{amt:marketSalary(p.ovr,ageOf(p,yr),yr), yrs:contractYears(ageOf(p,yr))};
  p.fa={ask:a.amt, yrs:a.yrs, from:ti}; FREE.push(p);
}

// ---------- 6. 自由市场 ----------
function faAsk(p){ const yr=W.off?W.off.year:W.year; if(!p.fa) p.fa={ask:marketSalary(p.ovr,ageOf(p,yr),yr), yrs:contractYears(ageOf(p,yr))}; return p.fa; }
function rosterCount(t, yr){ return t.players.filter(p=>p.contract && p.contract[1]>yr && p.contract[2]!=='tw').length; }
// 这份报价合不合规：返回 {ok, kind, why}
function offerRule(ti, amt, yr){
  const t=TEAMS[ti], C=CFG(yr), pay=payroll(t,yr), usedMLE=(W.mle[yr]||{})[ti];
  if(rosterCount(t,yr)>=15) return {ok:false, why:'阵容已满 15 人'};
  if(amt<=C.minSal) return {ok:true, kind:'底薪'};
  if(pay+amt<=C.cap) return {ok:true, kind:'工资帽空间'};
  if(!usedMLE && pay<C.apron1 && amt<=C.mleNT) return {ok:true, kind:'非纳税中产'};
  if(!usedMLE && pay<C.apron2 && amt<=C.mleTP) return {ok:true, kind:'纳税中产'};
  return {ok:false, why:`超出薪资帽规则（工资帽剩 ${money(Math.max(0,C.cap-pay))}，中产${usedMLE?'已用':pay<C.apron1?' '+money(C.mleNT):pay<C.apron2?' '+money(C.mleTP):'不可用'}）`};
}
function signFA(p, ti, amt, yrs, yr){
  const r=offerRule(ti,amt,yr); if(!r.ok) return r;
  if(r.kind && r.kind.includes('中产')){ W.mle[yr]=W.mle[yr]||{}; W.mle[yr][ti]=true; }
  const i=FREE.indexOf(p); if(i>=0) FREE.splice(i,1);
  p.contract=[amt, yr+yrs, 'std']; delete p.fa; TEAMS[ti].players.push(p); PBYID[p.id]=p; chemHit(ti,1); freezeOnSign(p);
  const t=TEAMS[ti]; t._rot=null; t.top8=t.players.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,8).reduce((s,q)=>s+q.ovr,0)/Math.max(1,Math.min(8,t.players.length));
  return {ok:true, kind:r.kind};
}
function teamWinPct(ti){ const S=G.season; const f=S&&S.final&&S.final.find(x=>x.i===ti); return f? f.w/82 : .5; }
function roleOn(p, ti){ const better=TEAMS[ti].players.filter(x=>x.ovr>p.ovr).length; return better<5?1: better<8?.5:0; }
function faRound(){
  resolveSheets();
  const O=W.off, yr=O.year, rnd=O.faRound; const floor=[1,.93,.86,.8,.74][Math.min(4,rnd-1)];
  const offers={};           // pid -> [{ti, amt, yrs}]
  const add=(pid,o)=>{ (offers[pid]=offers[pid]||[]).push(o); };
  // 玩家的报价
  Object.entries(O.userOffers||{}).forEach(([pid,o])=>{ if(PBYID[pid] && FREE.includes(PBYID[pid])) add(pid,{ti:G.team, amt:o.amt, yrs:o.yrs}); });
  // AI 报价
  const pool=FREE.slice().sort((a,b)=>b.ovr-a.ovr);
  TEAMS.forEach(t=>{ if(t.i===G.team) return;
    const C=CFG(yr); let n=0; let pay=payroll(t,yr); let cnt=rosterCount(t,yr);
    const tenth=t.players.slice().sort((a,b)=>b.ovr-a.ovr)[9]; const bar = tenth? tenth.ovr : 0;
    for(const p of pool){
      if(n>=3 || cnt+n>=15) break;
      if(p.ovr<=bar && cnt>=13) continue;
      const a=faAsk(p); const want=Math.round(a.ask*floor);
      let amt=null;
      if(pay+want<=C.cap) amt=want;
      else if(!(W.mle[yr]||{})[t.i] && pay<C.apron1 && want<=C.mleNT) amt=want;
      else if(!(W.mle[yr]||{})[t.i] && pay<C.apron2 && want<=C.mleTP) amt=want;
      else if(want<=C.minSal*1.25 && cnt<14) amt=C.minSal;
      if(amt==null || rnd01()<.2) continue;
      if(amt>C.minSal && !ownerOk(t.i, amt+(pay-payroll(t,yr)), yr)) continue;
      add(p.id,{ti:t.i, amt, yrs:a.yrs}); n++; pay+=amt;
    }
  });
  // 球员挑报价
  const signed=[];
  Object.entries(offers).forEach(([pid,list])=>{
    const p=PBYID[pid]; if(!p || !FREE.includes(p) || p.sheet) return;
    const a=faAsk(p); const minOk=Math.round(a.ask*floor*.97);
    const ok=list.filter(o=>o.amt>=minOk || o.amt>=CFG(yr).minSal && a.ask*floor<=CFG(yr).minSal*1.05);
    if(!ok.length) return;
    ok.sort((x,y)=>y.amt*(1+.15*teamWinPct(y.ti)+.1*roleOn(p,y.ti)) - x.amt*(1+.15*teamWinPct(x.ti)+.1*roleOn(p,x.ti)));
    for(const o of ok){
      if(p.rfa && o.ti===p.rfa.team){ signDirect(p,o.ti,o.amt,o.yrs,yr); signed.push({pid:p.id, ti:o.ti, amt:o.amt, yrs:o.yrs, user:o.ti===G.team}); break; }
      if(p.rfa && offerRule(o.ti,o.amt,yr).ok){ // 报价单：原球队有匹配权
        const orig=p.rfa.team;
        if(orig===G.team){ W.off.sheets=W.off.sheets||[]; W.off.sheets.push({pid:p.id, ti:o.ti, amt:o.amt, yrs:o.yrs}); p.sheet=true; break; }
        const match = o.amt<=marketSalary(p.ovr,ageOf(p,yr),yr)*1.2 && ownerOk(orig,o.amt,yr,1.05) && rosterCount(TEAMS[orig],yr)<15;
        if(match){ signDirect(p,orig,o.amt,o.yrs,yr); signed.push({pid:p.id, ti:orig, amt:o.amt, yrs:o.yrs, matched:o.ti, user:false}); addNews('匹配',`${TEAMS[orig].nick}匹配了${TEAMS[o.ti].nick}给 ${p.cn} 的报价单（${money(o.amt)} × ${o.yrs} 年）`); break; }
      }
      const r=signFA(p,o.ti,o.amt,o.yrs,yr); if(r.ok){ signed.push({pid:p.id, ti:o.ti, amt:o.amt, yrs:o.yrs, user:o.ti===G.team}); if(p.ovr>=80) addNews('签约',`${p.cn}（${p.ovr}）加盟${TEAMS[o.ti].nick}，${money(o.amt)} × ${o.yrs} 年`); break; }
    }
  });
  // 用户报价中被拒的
  const rejected=Object.keys(O.userOffers||{}).filter(pid=>!signed.some(s=>s.pid==pid && s.ti===G.team));
  O.userOffers={};
  FREE.forEach(p=>{ if(p.fa) p.fa.ask=Math.max(CFG(yr).minSal, Math.round(p.fa.ask*.93)); });
  return {signed, rejected};
}

// ---------- 7. 训练营：补人、裁人 ----------
function resolveSheets(){ const O=W.off; (O.sheets||[]).forEach(sh=>decideSheet(sh,false)); O.sheets=[]; }
function decideSheet(sh, match){
  const p=PBYID[sh.pid], yr=W.off.year; if(!p || !p.sheet) return;
  if(match){ signDirect(p,G.team,sh.amt,sh.yrs,yr); toast&&toast(`匹配成功，${p.cn}留队`); }
  else { delete p.sheet; delete p.rfa; const r=signFA(p,sh.ti,sh.amt,sh.yrs,yr); if(r.ok) addNews('签约',`${p.cn} 离开${TEAMS[G.team].nick}，加盟${TEAMS[sh.ti].nick}（${money(sh.amt)} × ${sh.yrs} 年）`); }
  W.off.sheets=(W.off.sheets||[]).filter(x=>x!==sh);
}
// 自由市场结束：还没人要的受限制自由球员按资格报价回原队
function settleRFA(){ const yr=W.off.year; FREE.slice().forEach(p=>{ if(p.rfa){ const t=p.rfa.team; if(rosterCount(TEAMS[t],yr)<15){ signDirect(p,t,p.rfa.qo,1,yr); if(t===G.team) (W.off.campLog=W.off.campLog||[]).push(`${p.cn} 接受资格报价留队`); } else { delete p.rfa; } } }); }
function campFill(){
  const yr=W.off.year, C=CFG(yr), log=[];
  TEAMS.forEach(t=>{
    // 超过 15 个正式合同：裁掉最差的（剩余合同算死钱）
    let std=t.players.filter(p=>p.contract && p.contract[2]!=='tw');
    while(std.length>15){ const w=std.sort((a,b)=>a.ovr-b.ovr)[0]; waive(w,t.i,yr); std=t.players.filter(p=>p.contract && p.contract[2]!=='tw'); if(t.i===G.team) log.push(`裁掉 ${w.cn}`); }
    // 少于 14 人：用底薪补
    while(t.players.filter(p=>p.contract && p.contract[2]!=='tw').length<14){
      const cand=FREE.slice().sort((a,b)=>b.ovr-a.ovr)[0]; if(!cand) break;
      const i=FREE.indexOf(cand); FREE.splice(i,1); cand.contract=[C.minSal, yr+1, 'std']; delete cand.fa; t.players.push(cand); chemHit(t.i,.5);
      if(t.i===G.team) log.push(`底薪签下 ${cand.cn}`);
    }
    // 双向合同过期的清掉
    t.players.filter(p=>p.contract && p.contract[2]==='tw' && p.contract[1]<=yr).forEach(p=>{ t.players=t.players.filter(x=>x!==p); p.contract=null; FREE.push(p); });
  });
  // 自由球员池只留 150 人，其余的（最差的）去海外打球
  if(FREE.length>150){ FREE.sort((a,b)=>b.ovr-a.ovr); FREE.splice(150); }
  reindex(); return log;
}
function waive(p, ti, yr){
  const t=TEAMS[ti]; const c=p.contract;
  if(c && c[1]>yr){ (W.dead[ti]=W.dead[ti]||[]).push({amt:c[0], exp:c[1], cn:p.cn}); }
  t.players=t.players.filter(x=>x!==p); p.contract=null; p.fa=null; FREE.push(p); t._rot=null;
}

// ---------- 流程控制 ----------
const OFF_STEPS=['赛季总结','选秀抽签','选秀大会','续约','自由市场','训练营'];
function startOffseason(){
  const S=G.season;
  W.off={step:0, year:S.year+1, report:null, lottery:null, draft:null, faRound:0, faLog:[], userOffers:{}, asks:{}};
  W.off.report=offSummary();
  ensurePicks(S.year+1); ensurePicks(S.year+2);
  ensureDraftClass(S.year+1);
  save();
}
function offNext(){
  const O=W.off;
  if(O.step===0){ O.lottery=runLottery(); O.step=1; }
  else if(O.step===1){ O.draft={year:O.lottery.year, order:O.lottery.order, idx:0, log:[], done:false}; O.step=2; draftAdvance(true); }
  else if(O.step===2){ if(!O.draft.done){ draftAdvance(false); } O.step=3; O.asks={}; expiringOf(G.team).forEach(p=>O.asks[p.id]=makeAsk(p,G.team));
    const n=2+Math.floor(rnd01()*3); for(let k=0;k<n;k++) tryAITrade(); }
  else if(O.step===3){ // 玩家没处理的：选项按 AI 标准处理，受限的发资格报价，其余放走；AI 自己续约
    expiringOf(G.team).forEach(p=>{ const et=expType(p);
      if(et==='option'){ if(p.ovr>=66||p.pot>=78) exerciseOption(p); else releaseToFA(p,G.team,O.asks[p.id]); }
      else if(et==='rfa') giveQO(p,G.team,O.asks[p.id]); else releaseToFA(p,G.team,O.asks[p.id]); });
    TEAMS.forEach(t=>{ if(t.i!==G.team) aiResign(t.i); });
    FREE.forEach(p=>faAsk(p)); O.step=4; O.faRound=1; }
  else if(O.step===4){ const r=faRound(); O.faLog.push(r); O.faRound++; if(O.faRound>5){ resolveSheets(); settleRFA(); O.step=5; const extra=O.campLog||[]; O.campLog=extra.concat(campFill()); } }
  else if(O.step===5){ startNewSeason(); return; }
  if(W.off && W.off.step<5) maybeUserOffer(.5);
  save();
}
function startNewSeason(){
  const O=W.off, y=O.year;
  // 旧的选秀权年份清掉，补上后年的
  Object.keys(W.picks).forEach(k=>{ if(+k<y+1) delete W.picks[k]; }); ensurePicks(y+1); ensurePicks(y+2);
  W.dead && Object.keys(W.dead).forEach(k=>W.dead[k]=W.dead[k].filter(d=>d.exp>y));
  W.off=null; FREE.forEach(p=>{ p.fa=null; delete p.rfa; delete p.sheet; });
  TEAMS.forEach(t=>{ t.aiRot=null; t._rot=null; t.players.forEach(p=>{ setMor(p,60+(mor(p)-60)*.5); }); });
  newSeason(y); G.rot=null; fixRot(); G.view='home'; save();
}

function vOff(v){

function toast(msg){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#243142;border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:8px;z-index:80;font-size:13px;max-width:90vw'; document.body.appendChild(el); }

// ================= 交易、自由球员、裁人 =================
// 规范：《第三阶段规范.md》§4 §7
function ctxYear(){ return W.off? W.off.year : W.year; }
function tradeOpen(){
  if(W.off) return {ok:true};
  const S=G.season; if(!S) return {ok:false, why:'还没开始赛季'};
  if(S.phase!=='reg') return {ok:false, why:'季后赛期间不能交易，休赛期再来'};
  const dl=dayOf(new Date(S.year+1,1,5));
  if(S.day>dl) return {ok:false, why:`已经过了交易截止日（${S.year+1} 年 2 月 5 日）`};
  return {ok:true, deadline:dl};
}
function pickValue(pk, mode, prot){
  const slot=projSlot(pk);
  const eff = pk.round===1? 80-(slot-1)*.45 : 63-(slot-1)*.08;
  let v=Math.pow(Math.max(0,eff-58),2.2);
  if(mode==='rebuild') v*=1.3;
  if(pk.year>ctxYear()+ (W.off?0:1)) v*=.85;
  return v*protFactor(pk, prot==null? protOf(pk) : prot);
}
let TR={partner:null, mineP:new Set(), theirP:new Set(), mineK:new Set(), theirK:new Set(), prot:{}};
function pkKey(pk){ return `${pk.year}-${pk.round}-${pk.orig}`; }
function pkFromKey(k){ const [y,r,o]=k.split('-').map(Number); return {year:y,round:r,orig:o}; }

function tradeSal(ps, yr){ return ps.reduce((s,p)=>s+(p.contract&&p.contract[1]>yr&&p.contract[2]!=='tw'?p.contract[0]:0),0); }
// A 送出 outA（球员）outAk（选秀权），B 送出 outB、outBk。返回违反规则的说明
function checkTrade(ai, outA, bi, outB, yr, labels){
  const C=CFG(yr), iss=[]; labels=labels||[TEAMS[ai].nick, TEAMS[bi].nick];
  [[ai,outA,outB,labels[0]],[bi,outB,outA,labels[1]]].forEach(([ti,out,inn,lb])=>{
    const t=TEAMS[ti], pay=payroll(t,yr)-tradeSal(out,yr)+tradeSal(inn,yr), sIn=tradeSal(inn,yr), sOut=tradeSal(out,yr);
    const r=matchRule(pay, sOut, out.length, yr);

// ================= 劳资协议：薪资匹配分档、冷冻期、受保护选秀权 =================
// 规范：《第六阶段规范.md》§1
function dayNumOf(dt){ return Math.floor(dt.getTime()/864e5); }
function todayNum(){ if(W.off) return dayNumOf(new Date(W.off.year,6,10)); const S=G.season; return S? dayNumOf(dateOf(S.day)) : dayNumOf(new Date(W.year,9,1)); }
function numDateTxt(n){ const d=new Date(n*864e5+12*3600e3); return `${d.getMonth()+1}月${d.getDate()}日`; }
function seasonYearNow(){ return W.off? W.off.year : W.year; }
function freezeOnSign(p){ const y=seasonYearNow(), dec=dayNumOf(new Date(y,11,15)); p.frz = W.off? dec : Math.max(dec, todayNum()+90); }
function frozen(p){ return !!(p && p.frz && p.frz>todayNum()); }
function frzTag(p){ return frozen(p)? ` <span class="pill" style="background:#1d3a5c">冻结至 ${numDateTxt(p.frz)}</span>` : ''; }

// 薪资匹配：返回 {tier, max}（max=null 表示不限）
function matchRule(payAfter, outSal, outN, yr){
  const C=CFG(yr), k=capMul(yr);
  if(payAfter<=C.cap) return {tier:'帽下', max:null};
  if(payAfter<=C.apron1){ const m= outSal<=750*k? outSal*2+25*k : outSal<=2900*k? outSal+750*k : outSal*1.25+25*k; return {tier:'帽上', max:Math.round(m)}; }
  if(payAfter<=C.apron2) return {tier:'第一土豪线以上', max:outSal};
  return {tier:'第二土豪线以上', max:outSal, noAgg:true};
}
function matchTxt(r){ return r.tier==='帽下'? '交易后在工资帽以下，换进来的薪资不限'
  : r.tier==='帽上'? `交易后超过工资帽，换进来的薪资最多 ${money(r.max)}`
  : r.tier==='第一土豪线以上'? `交易后超过第一土豪线，换进来的薪资不能超过换出去的（${money(r.max)}）`
  : `交易后超过第二土豪线，换进来的不能超过换出去的（${money(r.max)}），也不能合并两人以上的工资换一个人`; }

// ---------- 受保护选秀权 ----------
const PROT_OPTS=[0,5,10,14];
function protOf(pk){ return (W.prot||{})[pkKey(pk)]||0; }
function protTxt(n){ return n? `前 ${n} 保护` : ''; }
function projSlot(pk){ // 预计顺位（首轮 1–30）
  if(W.off && W.off.lottery && pk.year===W.off.lottery.year){ const o=W.off.lottery.order.find(x=>x.round===pk.round && x.orig===pk.orig); if(o) return pk.round===1?o.no:o.no-30; }
  const rank=TEAMS.slice().sort((a,b)=>b.top8-a.top8).findIndex(t=>t.i===pk.orig); return 30-rank;
}
function protFactor(pk, n){ if(!n || pk.round!==1) return 1; return projSlot(pk)<=n? .5 : 1-.15*n/14; }
// 抽签后处理：保护范围内的签回到原球队，得签一方拿下一年的首轮（或两个次轮）
function resolveProtections(year, r1){
  W.prot=W.prot||{};
  r1.forEach((orig,k)=>{ const key=`${year}-1-${orig}`, n=W.prot[key]; if(!n) return; delete W.prot[key];
    const owner=W.picks[year][1][orig]; if(owner===orig) return;
    if(k+1>n){ addNews('选秀权',`${TEAMS[orig].nick}送出的${year}年首轮签（前 ${n} 保护）抽到第 ${k+1} 顺位，转给${TEAMS[owner].nick}`); return; }
    W.picks[year][1][orig]=orig; const ny=year+1; ensurePicks(ny);
    let got;
    if(W.picks[ny][1][orig]===orig){ W.picks[ny][1][orig]=owner; got=`${ny} 年首轮签`; }
    else { W.picks[ny][2][orig]===orig && (W.picks[ny][2][orig]=owner); ensurePicks(ny+1); W.picks[ny+1][2][orig]===orig && (W.picks[ny+1][2][orig]=owner); got='两个次轮签'; }
    const txt=`${TEAMS[orig].nick}的${year}年首轮签抽到第 ${k+1} 顺位，在前 ${n} 保护范围内，签留在原队；${TEAMS[owner].nick}改拿${TEAMS[orig].nick}的${got}`;
    addNews('选秀权',txt); if(owner===G.team||orig===G.team) (G.season?G.season.inbox:[]).push({d:G.season?G.season.day:0, t:'选秀权保护生效', b:txt});
  });
}

// ---------- 选秀夜：上位报价 ----------
function pickUsed(k){ const O=W.off; if(!O || !O.draft || k.year!==O.draft.year) return false; const i=O.draft.order.findIndex(o=>o.round===k.round && o.orig===k.orig); return i>=0 && i<O.draft.idx; }
function maybeDraftOffer(pk){
  const O=W.off, D=O.draft; O.dOffered=O.dOffered||{};
  if(pk.round!==1 || O.dOffered[pk.no]) return; O.dOffered[pk.no]=true;
  if(rnd01()>=.35) return;
  const mineK={year:D.year, round:1, orig:pk.orig}, vMine=pickValue(mineK,'rebuild',0);
  const later=D.order.slice(D.idx+1).filter(o=>o.round===1 && o.owner!==G.team);
  for(const o of later.sort(()=>rnd01()-.5).slice(0,6)){
    const theirK={year:D.year, round:1, orig:o.orig}, gap=vMine-pickValue(theirK,'rebuild',0); if(gap<=0) continue;
    const fut=picksOwnedBy(o.owner).filter(k=>k.year>D.year && !protOf(k)).map(k=>({k,v:pickValue(k,'rebuild')}));
    let best=null;
    for(let i=0;i<fut.length;i++){ const v1=fut[i].v; if(v1>=gap*.95 && v1<=gap*1.8 && (!best||v1<best.v)) best={ks:[fut[i].k],v:v1};
      for(let j=i+1;j<fut.length;j++){ const v2=v1+fut[j].v; if(v2>=gap*.95 && v2<=gap*1.8 && (!best||v2<best.v)) best={ks:[fut[i].k,fut[j].k],v:v2}; } }
    if(!best) continue;
    W.offers=(W.offers||[]).filter(x=>!x.draft);
    W.offers.push({id:'d'+Date.now(), draft:true, from:o.owner, give:{p:[], k:[theirK,...best.ks].map(pkKey)}, get:{p:[], k:[pkKey(mineK)]}, exp:{off:true, step:O.step}});
    return;
  }
}

function teamsByMode(){ const c=[], r=[]; TEAMS.forEach(t=>{ if(t.i===G.team) return; (teamMode(t.i)==='contend'?c:r).push(t.i); }); return {c,r}; }
function tradeableAssets(ti, yr, exclude){
  const t=TEAMS[ti], top=t.players.slice().sort((a,b)=>b.ovr-a.ovr), protect=new Set(top.slice(0,exclude||0).map(p=>p.id));
  return {players:t.players.filter(p=>!protect.has(p.id) && !frozen(p) && p.contract && p.contract[1]>yr && p.contract[2]!=='tw' && !(p.injury>200)), picks:picksOwnedBy(ti)};
}
// 从 giver 的资产里枚举「最多 3 人 + 2 个签」的组合：接收方得到的价值 ≥ minRecv，送出方付出的价值 ≤ maxGive，规则合规，溢价最小
function searchPackage(giver, receiver, recvOut, recvOutK, recvVal, giveVal, minRecv, maxGive, yr, protectN, filterP){
  const A=tradeableAssets(giver,yr,protectN);
  // 候选：对方最看重的 9 人，加上工资最高的 4 人（凑薪资用的「填充合同」）
  const all=A.players.filter(filterP||(()=>true)).map(p=>({p, r:recvVal(p), g:giveVal(p)}));
  const byVal=all.filter(x=>x.r>3).sort((x,y)=>y.r-x.r).slice(0,9);
  const bySal=all.filter(x=>!byVal.includes(x)).sort((x,y)=>(y.p.contract?y.p.contract[0]:0)-(x.p.contract?x.p.contract[0]:0)).slice(0,4);
  const P=[...byVal,...bySal];
  const K=A.picks.map(k=>({k, r:recvVal(k), g:giveVal(k)})).sort((x,y)=>y.r-x.r).slice(0,4);
  let best=null, bestScore=1e18;
  const pc=[[]]; for(let i=0;i<P.length;i++){ pc.push([i]); for(let j=i+1;j<P.length;j++){ pc.push([i,j]); for(let k=j+1;k<P.length;k++) pc.push([i,j,k]); } }
  const kc=[[]]; for(let i=0;i<K.length;i++){ kc.push([i]); for(let j=i+1;j<K.length;j++) kc.push([i,j]); }
  for(const pi of pc) for(const ki of kc){
    if(!pi.length && !ki.length) continue;
    let r=0,g=0; pi.forEach(i=>{ r+=P[i].r; g+=P[i].g; }); ki.forEach(i=>{ r+=K[i].r; g+=K[i].g; });
    if(r<minRecv || g>maxGive) continue;
    const sc=r-minRecv + (pi.length+ki.length)*3;          // 溢价越小、件数越少越好
    if(sc>=bestScore) continue;
    const outP=pi.map(i=>P[i].p);
    if(checkTrade(giver,outP,receiver,recvOut,yr).length) continue;
    best={outP, outK:ki.map(i=>K[i].k), r, g}; bestScore=sc;
  }
  return best;
}
// 买家 bi 用年轻人和选秀权，向卖家 si 换一个老将
function genAITrade(bi, si, yr){
  const B=TEAMS[bi], S=TEAMS[si];
  const bTop=B.players.slice().sort((a,b)=>b.ovr-a.ovr); const fifth=bTop[4]?bTop[4].ovr:70;
  const targets=S.players.filter(p=>!frozen(p) && p.contract && p.contract[1]>yr && p.contract[2]!=='tw' && (ageOf(p,yr)>=26||p.treq) && p.ovr>fifth && !(p.injury>30)).sort((a,b)=>(b.treq?1:0)-(a.treq?1:0)||b.ovr-a.ovr);
  for(const target of targets.slice(0,3)){
    const sLose=playerValue(target,'rebuild',yr), bGain=playerValue(target,'contend',yr);
    const pk=searchPackage(bi, si, [target], [], x=>x.id!=null?playerValue(x,'rebuild',yr):pickValue(x,'rebuild'), x=>x.id!=null?playerValue(x,'contend',yr):pickValue(x,'contend'),
      sLose*1.05+20, bGain*1.2+20, yr, 3);   // 争冠队愿意为即战力多付两成
    if(pk && ownerOk(bi, (target.contract?target.contract[0]:0)-tradeSal(pk.outP,yr), yr, 1.03)) return {bi, si, outP:pk.outP, outK:pk.outK, target};
  }
  return null;
}
function tryAITrade(){
  const yr=ctxYear(), {c,r}=teamsByMode(); if(!c.length||!r.length) return false;
  const unhappy=TEAMS.filter(t=>t.i!==G.team && t.players.some(p=>p.treq)).map(t=>t.i);
  for(let k=0;k<8;k++){
    let bi=pickOne(c), si=pickOne(r);
    if(unhappy.length && rnd01()<.4){ si=pickOne(unhappy); bi=pickOne(c.filter(x=>x!==si).concat(r.filter(x=>x!==si && TEAMS[x].top8>TEAMS[si].top8))); if(bi==null) continue; }
    const T=genAITrade(bi,si,yr);
    if(T){ execTrade(T.bi,T.outP,T.outK,T.si,[T.target],[]); W.aiTrades=(W.aiTrades||0)+1; return true; }
  }
  return false;
}

// ---------- AI 找玩家 ----------
function genUserOffer(){
  const yr=ctxYear(), U=myTeam(), uMode=teamMode(G.team);
  const ai=pickOne(TEAMS.filter(t=>t.i!==G.team)).i, mode=teamMode(ai);
  // AI 想要什么
  let target=null;
  if(mode==='contend'){ const five=TEAMS[ai].players.slice().sort((a,b)=>b.ovr-a.ovr)[4];
    const c=U.players.filter(p=>!frozen(p) && p.contract && p.contract[1]>yr && p.contract[2]!=='tw' && ageOf(p,yr)>=25 && p.ovr>(five?five.ovr:70) && !(p.injury>20));
    if(c.length) target={p:pickOne(c.sort((a,b)=>b.ovr-a.ovr).slice(0,4))}; }
  else { const c=U.players.filter(p=>!frozen(p) && p.contract && p.contract[2]!=='tw' && ageOf(p,yr)<=23 && p.pot>=80);
    const ks=picksOwnedBy(G.team).filter(k=>k.round===1);
    if(c.length && (rnd01()<.6 || !ks.length)) target={p:pickOne(c)}; else if(ks.length) target={k:pickOne(ks)}; }
  if(!target) return null;
  const tUser = target.p? playerValue(target.p,uMode,yr) : pickValue(target.k,uMode);
  const tAI   = target.p? playerValue(target.p,mode,yr)  : pickValue(target.k,mode);
  const inP=target.p?[target.p]:[], inK=target.k?[target.k]:[];
  const pk=searchPackage(ai, G.team, inP, inK, x=>x.id!=null?playerValue(x,uMode,yr):pickValue(x,uMode), x=>x.id!=null?playerValue(x,mode,yr):pickValue(x,mode),
    tUser*.9, tAI*.97, yr, mode==='contend'?3:1);
  if(!pk) return null;
  if(!ownerOk(ai, tradeSal(inP,yr)-tradeSal(pk.outP,yr), yr, 1.03)) return null;
  const outP=pk.outP, outK=pk.outK;
  const S=G.season;
  return {id:Date.now()+'-'+Math.floor(rnd01()*1e6), from:ai, give:{p:outP.map(p=>p.id), k:outK.map(pkKey)}, get:{p:inP.map(p=>p.id), k:inK.map(pkKey)},
    exp: W.off? {off:true, step:W.off.step+1} : {off:false, day:(S?S.day:0)+3}};
}
function maybeUserOffer(prob){
  W.offers=(W.offers||[]).filter(o=>!offerExpired(o));
  if(W.offers.length>=2 || rnd01()>=prob) return;
  let o=null; for(let k=0;k<4 && !o;k++) o=genUserOffer(); if(o){ W.offers.push(o); if(G.season) G.season.inbox.push({d:G.season.day, t:`${TEAMS[o.from].cn}发来交易报价`, b:'在首页的「交易报价」里查看。'}); }
}
function offerExpired(o){ if([...o.give.k,...o.get.k].some(k=>pickUsed(pkFromKey(k)))) return true; if(o.exp.off) return !W.off || W.off.step>o.exp.step; return W.off || !G.season || G.season.day>o.exp.day || G.season.phase!=='reg'; }
function offerItems(o){ return {give:o.give.p.map(id=>PBYID[id]).filter(Boolean), giveK:o.give.k.map(pkFromKey), get:o.get.p.map(id=>PBYID[id]).filter(Boolean), getK:o.get.k.map(pkFromKey)}; }
function acceptOffer(id){
  const o=(W.offers||[]).find(x=>x.id===id); if(!o) return;
  const it=offerItems(o), yr=ctxYear();
  const valid = it.give.every(p=>TEAMS[o.from].players.includes(p)) && it.get.every(p=>myTeam().players.includes(p))
    && it.giveK.every(k=>W.picks[k.year]&&W.picks[k.year][k.round][k.orig]===o.from) && it.getK.every(k=>W.picks[k.year]&&W.picks[k.year][k.round][k.orig]===G.team);
  const iss=valid? checkTrade(G.team,it.get,o.from,it.give,yr,['你方','对方']) : ['阵容已经变了，这份报价作废'];
  W.offers=W.offers.filter(x=>x!==o);
  if(iss.length){ toast(iss[0]); save(); return; }
  const txt=execTrade(G.team,it.get,it.getK,o.from,it.give,it.giveK);
  if(G.season) G.season.inbox.push({d:G.season.day, t:`接受了${TEAMS[o.from].cn}的报价`, b:txt});
  toast('交易完成'); save();
}
function rejectOffer(id){ W.offers=(W.offers||[]).filter(x=>x.id!==id); save(); }

// ================= 财政：收入、奢侈税、老板上限 =================
// 规范：《第六阶段规范.md》§2
const TAX_BASE=[1.5,1.75,2.5,3.25], TAX_REP=[2.5,2.75,3.5,4.25];
function taxBand(year){ return Math.round(500*capMul(year)); }
function taxOf(pay, year, rep){
  let over=pay-CFG(year).tax; if(over<=0) return 0;
  const band=taxBand(year), R=rep?TAX_REP:TAX_BASE; let t=0, i=0;
  while(over>0){ const r= i<4? R[i] : R[3]+.5*(i-3); const x=Math.min(band,over); t+=x*r; over-=x; i++; }
  return Math.round(t);
}
function isRepeater(ti, year){ const h=((W.taxHist||{})[ti])||[]; return h.filter(y=>y>=year-4 && y<year).length>=3; }
function teamTax(ti, year){ year=year||W.year; return taxOf(payroll(TEAMS[ti],year), year, isRepeater(ti,year)); }
function mktF(ti){ return clamp(Math.sqrt(TEAMS[ti].pop)/Math.sqrt(19),0,1); }
// 老板能接受的总支出（工资 + 奢侈税）
function ownerLimit(ti, year){ year=year||W.year; return Math.round(CFG(year).tax + (1500+6000*mktF(ti))*capMul(year)); }
function spendOf(ti, year){ year=year||W.year; const pay=payroll(TEAMS[ti],year); return pay+taxOf(pay,year,isRepeater(ti,year)); }
function spendAfter(ti, addPay, year){ const pay=payroll(TEAMS[ti],year)+addPay; return pay+taxOf(pay,year,isRepeater(ti,year)); }
// 不超过上限，或者不比现在花得更多（已经超了的球队可以减支，但不能再加）
function ownerOk(ti, addPay, year, slack){ const after=spendAfter(ti,addPay,year); return after <= ownerLimit(ti,year)*(slack||1) || (addPay<=0); }

function leagueShare(year){ return Math.round(CFG(year).cap*.85); }
function localRev(ti, wp, year){ return Math.round(CFG(year).cap*(.35+.045*TEAMS[ti].pop)*(.75+.5*wp)); }
function homeGateRev(ti, year){ return Math.round(CFG(year).cap*.012*(1+TEAMS[ti].pop/10)); }
function opCost(year){ return Math.round(CFG(year).cap*.25); }
function homePlayoffGames(S, ti){ let n=0; (S.playin||[]).forEach(x=>{ if(x.h===ti && x.w!=null) n++; }); if(S.po) S.po.series.forEach(sr=>sr.games.forEach(g=>{ if(g.h===ti) n++; })); return n; }

// 本季财政（进行中是预计值，赛季结束后是结算值）
function finOf(ti){
  const S=G.season, year=S.year, R=standings()[ti], wp=R.g? R.w/R.g : .5;
  if(S.fin && S.fin[ti] && S.fin[ti].final) return S.fin[ti];
  const pay=S.fin&&S.fin[ti]? S.fin[ti].pay : payroll(TEAMS[ti],year), rep=isRepeater(ti,year);
  const tax=S.fin&&S.fin[ti]? S.fin[ti].tax : taxOf(pay,year,rep);
  const hg=homePlayoffGames(S,ti), share=S.fin&&S.fin[ti]? S.fin[ti].share||0 : 0;
  const rev={league:leagueShare(year), local:localRev(ti,wp,year), playoff:hg*homeGateRev(ti,year), share};
  const revT=rev.league+rev.local+rev.playoff+rev.share, cost=opCost(year);
  return {pay, tax, rep, rev, revT, cost, profit:revT-pay-tax-cost, spend:pay+tax, limit:ownerLimit(ti,year), hg, settled:!!(S.fin&&S.fin[ti])};
}
// 常规赛最后一天：按工资结算奢侈税，税款平分给没交税的球队
function settleTax(){
  const S=G.season, year=S.year; S.fin={}; W.taxHist=W.taxHist||{}; let pool=0; const payers=[];
  TEAMS.forEach(t=>{ const pay=payroll(t,year), rep=isRepeater(t.i,year), tax=taxOf(pay,year,rep); S.fin[t.i]={pay,tax,rep,share:0};
    if(tax>0){ pool+=tax; payers.push(t.i); (W.taxHist[t.i]=W.taxHist[t.i]||[]).push(year); } });
  const non=TEAMS.filter(t=>!payers.includes(t.i)); non.forEach(t=>S.fin[t.i].share=Math.round(pool/Math.max(1,non.length)));
  if(payers.length) addNews('奢侈税',`${year}-${String((year+1)%100).padStart(2,'0')} 赛季 ${payers.length} 队交了奢侈税，共 ${money(pool)}：${payers.map(i=>TEAMS[i].nick+' '+money(S.fin[i].tax)).join('，')}`);
  const me=S.fin[G.team]; S.inbox.push({d:S.day, t:'奢侈税结算', b: me.tax? `按常规赛最后一天的工资 ${money(me.pay)}，你交了 ${money(me.tax)} 奢侈税${me.rep?'（重复纳税，税率更高）':''}。` : `你没交奢侈税，分到其他球队交的奢侈税 ${money(me.share)}。`});
}
// 赛季结束：结算盈亏，超出老板上限扣信任度
function financeSeasonEnd(){
  const S=G.season; if(!S.fin) settleTax();
  TEAMS.forEach(t=>{ const f=finOf(t.i); S.fin[t.i]=Object.assign(f,{final:true}); });
  const f=S.fin[G.team]; let pen=0;
  const first=!(G.career||[]).some(c=>c.team===G.team && c.year===S.year-1);   // 接手第一季，老板不追究前任留下的合同
  if(f.spend>f.limit && !first) pen=Math.min(15, Math.max(1, Math.round((f.spend-f.limit)/f.limit*100)));
  return {pen, f, first};
}
function finMonthlyNote(){ const f=finOf(G.team); if(f.spend>f.limit) return `财政上，预计工资加奢侈税 ${money(f.spend)}，超出老板能接受的 ${money(f.limit)}。`; return ''; }

// ================= 士气、化学反应、教练组、训练、球探 =================
// 规范：《第五阶段规范.md》§1–3
const EXP_MIN=[34,32,30,28,26,22,18,16,12,8];
const FOCUS={bal:['均衡',null], shoot:['投篮',['three','mid','ft','finish']], def:['防守',['perD','intD','stl','blk','diq']], phys:['身体',['spd','jmp','str','sta']], iq:['球商',['oiq','diq','pass','handle']]};
const INTEN={low:['轻',.7,.85,35], mid:['正常',1,1,30], high:['高',1.3,1.2,25]};   // 名称、成长、伤病、每天体能恢复
const STAFF=[['med','队医'],['trn','训练师'],['sct','球探']];
const SCOUT_HW=[[5,10],[4,8],[3,6],[2,4],[1,2]];

function randStaff(){ let m,t,s; do{ m=2+Math.floor(rnd01()*3); t=2+Math.floor(rnd01()*3); s=10-m-t; }while(s<2||s>4); return {med:m,trn:t,sct:s}; }
function tmeta(ti){ W.tm=W.tm||{}; let m=W.tm[ti]; if(!m) m=W.tm[ti]={chem:50, staff:randStaff(), focus:'bal', inten:'mid'}; return m; }
function mor(p){ return p.mor==null?60:p.mor; }
function setMor(p,v){ p.mor=Math.round(clamp(v,0,100)*10)/10; }
function chemHit(ti, n){ if(ti==null||ti<0) return; const m=tmeta(ti); m.chem=clamp(m.chem-4*n,0,100); }
function staffEditable(){ const S=G.season; return !!W.off || (S && S.phase==='reg' && S.day===0); }

// 比赛前：士气系数、化学反应、伤病系数
function applyLife(){ TEAMS.forEach(t=>t.players.forEach(p=>{ p.formMul=1+(mor(p)-60)*.0008; })); }
function lifeSide(ti){ const m=tmeta(ti); return {chemAdj:(m.chem-50)/5000, injMul:(1.15-.05*m.staff.med)*INTEN[m.inten][2]}; }
function injDaysMul(ti){ return ti>=0? 1.3-.1*tmeta(ti).staff.med : 1; }
function dailyRecover(ti){ if(ti<0) return 30; const m=tmeta(ti); return INTEN[m.inten][3]+2*(m.staff.med-3); }
function teamMapOfPlayers(){ const map={}; TEAMS.forEach(t=>t.players.forEach(p=>map[p.id]=t.i)); return map; }

// ---------- 每周：士气、化学反应 ----------
// 士气向「目标值」靠拢：60 + 上场时间 + 最近战绩 + 球星在烂队；交易、全明星、NBA 杯是一次性加减
function weeklyLife(){
  const S=G.season, R=standings(); S.snap=S.snap||{}; S.snapT=S.snapT||{}; S.low=S.low||{}; S.complain=S.complain||{};
  TEAMS.forEach(t=>{
    const m=tmeta(t.i), r=R[t.i], tg=r.g-(S.snapT[t.i]||0); S.snapT[t.i]=r.g;
    const l10=r.l10.length? r.l10.filter(x=>x==='W').length/r.l10.length : .5;
    const healthy=t.players.filter(p=>!(p.injury>0)).sort((a,b)=>b.ovr-a.ovr);
    t.players.forEach(p=>{
      const q=S.ps[p.id], sn=S.snap[p.id]||0, mins=(q?q.min:0)-sn; S.snap[p.id]=q?q.min:0;
      if(tg<=0) return;
      let target=60+(l10-.5)*30;
      const rank=healthy.indexOf(p);
      if(rank>=0){ const exp=EXP_MIN[rank]||0, mpg=mins/tg;
        if(exp>=8){ if(mpg>=exp*.85) target+=12; else if(mpg<exp*.6) target-=20; else target-=6; } }
      if(p.ovr>=85 && l10<.4) target-=12;
      setMor(p, mor(p)+(target-mor(p))*.25+gauss(0,1.5));
      // 不满和要求交易
      if(mor(p)<32 && t.i===G.team && (S.complain[p.id]==null || S.day-S.complain[p.id]>=30)){ S.complain[p.id]=S.day;
        S.inbox.push({d:S.day, t:`${p.cn} 有情绪`, b: rank>=0 && (EXP_MIN[rank]||0)>=8 ? `他觉得自己该打更多时间。士气 ${Math.round(mor(p))}。` : `球队最近输得太多，他不太开心。士气 ${Math.round(mor(p))}。`}); }
      if(mor(p)<25){ S.low[p.id]=(S.low[p.id]||0)+1;
        if(S.low[p.id]>=2 && !p.treq && p.ovr>=72){ p.treq=true; addNews('要求交易',`${p.cn}（${t.nick}）公开要求交易`);
          if(t.i===G.team) S.inbox.push({d:S.day, t:`${p.cn} 要求交易`, b:'他已经公开表态想走。士气不回升的话，续约时他不会留下。'}); } }
      else { S.low[p.id]=0; if(p.treq && mor(p)>40) delete p.treq; }
    });
    // 化学反应
    const top=t.players.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,10), avg=top.reduce((s,p)=>s+mor(p),0)/Math.max(1,top.length);
    m.chem=clamp(m.chem + .5 + (avg-60)*.05 + (l10-.5)*2 - (m.chem-50)*.03, 0, 100);
  });
}

// ---------- 赛季中成长：每 14 天一次，一年 12 次，占全年的 40% ----------
function growthBase(p, age){
  let d=AGE_DELTA(age);
  if(d>0){ const gap=Math.max(0,p.pot-p.ovr); d*= gap>0? Math.min(1.6, 0.7+gap/25) : (age<26?.3:1); d*=.75+p.prof/200; d*=devMul(p,age); }
  else d*=1.25-p.prof/200;
  return d;
}
function trainMul(ti, d){ if(ti<0) return 1; const lv=tmeta(ti).staff.trn; return d>0? .7+.1*lv : 1.3-.1*lv; }
function bumpOvr(p, dir, keys, age){
  const target=clamp(p.ovr+dir,30,99); let n=0;
  while(calcOvr(p)!==target && n++<8){ const ks= dir>0? (keys && rnd01()<.8? keys : KEYS) : (age>=30? PHYS : KEYS); const k=pickOne(ks); p.a[k]=clamp(p.a[k]+dir,20,99); }
  p.ovr=calcOvr(p);
}
function growthTick(){
  const S=G.season, yr=S.year+1, R=standings(); let changed=false;
  TEAMS.forEach(t=>{ const m=tmeta(t.i), I=INTEN[m.inten], tg=Math.max(1,R[t.i].g);
    t.players.forEach(p=>{
      const age=ageOf(p,yr), base=growthBase(p,age), q=S.ps[p.id];
      const mm= base>0 && age<=24? minMul(q?q.min/tg:0, p.contract&&p.contract[2]==='tw') : 1;
      const step=base*.4/12*trainMul(t.i,base)*(base>0?I[1]:1)*mm;
      p.gx=(p.gx||0)+step;
      const keys=FOCUS[p.tf||m.focus][1];
      if(p.gx>=1){ p.gx-=1; if(p.ovr<p.pot){ const o=p.ovr; bumpOvr(p,1,keys,age); changed=changed||p.ovr!==o; } }
      else if(p.gx<=-1){ p.gx+=1; const o=p.ovr; bumpOvr(p,-1,null,age); changed=changed||p.ovr!==o; }
    });
  });
  if(changed) reindex();
}

// ---------- 球探 ----------
function scoutLevel(ti){ return tmeta(ti).staff.sct; }
function focusLimit(){ return 2+2*scoutLevel(G.team); }
function refreshScout(){
  const L=scoutLevel(G.team), F=new Set(W.scoutFocus||[]);
  (W.draftClass||[]).forEach(p=>{ if(!p.sz) p.sz=[gauss(0,1),gauss(0,1)];
    const [ho,hp]=SCOUT_HW[(F.has(p.id)?5:L)-1], k=F.has(p.id)?.3:.6;
    const co=Math.round(p.ovr+p.sz[0]*ho*k), cp=Math.round(p.pot+p.sz[1]*hp*k);
    p.scout={o:[co-ho,co+ho], p:[cp-hp,cp+hp]}; });
}
function perceivedBy(p, ti){
  if(ti===G.team){ if(!p.scout) refreshScout(); return (p.scout.o[0]+p.scout.o[1])/4+(p.scout.p[0]+p.scout.p[1])/4; }
  const r=srand(p.id*1009+ti*31), z=()=>(r()+r()+r()-1.5)*2, [ho,hp]=SCOUT_HW[scoutLevel(ti)-1];
  return (p.ovr+z()*ho*.6)*.5+(p.pot+z()*hp*.6)*.5;
}
function ensureDraftClass(year){
  if(W.dcYear===year && (W.draftClass||[]).length) return;
  W.draftClass=genDraftClass(year); W.dcYear=year; W.scoutFocus=[]; refreshScout();
}

// 规范：《第五阶段规范.md》§4–5

// ---------- NBA 杯 ----------
function drawCupGroups(seed){
  const rng=srand(seed^0x5bd1), groups={};
  ['东','西'].forEach(cf=>{ const ts=TEAMS.filter(t=>t.conf===cf).map(t=>t.i);
    for(let i=ts.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [ts[i],ts[j]]=[ts[j],ts[i]]; }
    groups[cf]=[ts.slice(0,5), ts.slice(5,10), ts.slice(10,15)]; });
  return groups;
}
function cupPairSet(groups){ const s=new Set(); Object.values(groups).forEach(gs=>gs.forEach(g=>{ for(let x=0;x<5;x++) for(let y=x+1;y<5;y++) s.add(Math.min(g[x],g[y])+'-'+Math.max(g[x],g[y])); })); return s; }
function cupGroupTable(S, g){
  const R=g.map(i=>({i,w:0,l:0,pd:0}));
  S.games.forEach(q=>{ if(q[6]!=='cup'||q[3]==null) return; const h=R.find(r=>r.i===q[1]), a=R.find(r=>r.i===q[2]); if(!h||!a) return;
    const d=q[3]-q[4]; h.pd+=d; a.pd-=d; if(d>0){h.w++;a.l++;} else {a.w++;h.l++;} });
  return R.sort((x,y)=>y.w-x.w||y.pd-x.pd);
}
function buildCupKO(S){
  const C=S.cup; C.ko=[];
  ['东','西'].forEach((cf,ci)=>{
    const tabs=C.groups[cf].map(g=>cupGroupTable(S,g));
    const winners=tabs.map(t=>t[0]).sort((x,y)=>y.w-x.w||y.pd-x.pd);
    const wild=tabs.map(t=>t[1]).sort((x,y)=>y.w-x.w||y.pd-x.pd)[0];
    const seeds=[...winners, wild].map(r=>r.i); C[cf+'Seeds']=seeds;
    const day=CUP_DAYS[ci];
    C.ko.push({id:cf+'q1', rd:'qf', cf, day, h:seeds[0], a:seeds[3], w:null});
    C.ko.push({id:cf+'q2', rd:'qf', cf, day, h:seeds[1], a:seeds[2], w:null});
    C.ko.push({id:cf+'s', rd:'sf', cf, day:CUP_DAYS[2], h:null, a:null, w:null});
  });
  C.ko.push({id:'f', rd:'f', cf:'总', day:CUP_DAYS[3], h:null, a:null, w:null});
  const mineIn=C.ko.some(x=>x.h===G.team||x.a===G.team);
  addNews('NBA杯',`NBA 杯淘汰赛八强：${C.ko.filter(x=>x.rd==='qf').map(x=>TEAMS[x.h].nick+' 对 '+TEAMS[x.a].nick).join('，')}`);
  S.inbox.push({d:S.day, t:'NBA 杯小组赛结束', b: mineIn? '你的球队打进了淘汰赛八强。' : '你的球队没能从小组出线。'});
}
function cupPropagate(S){
  const K=S.cup.ko, by=id=>K.find(x=>x.id===id);
  ['东','西'].forEach(cf=>{ const s=by(cf+'s'), a=by(cf+'q1'), b=by(cf+'q2');
    if(s.h==null && a.w!=null && b.w!=null){ s.h=a.w; s.a=b.w; } });
  const f=by('f'), e=by('东s'), w=by('西s');
  if(f.h==null && e.w!=null && w.w!=null){ f.h=e.w; f.a=w.w; }
  if(f.w!=null && S.cup.champ==null){ const ch=f.w; S.cup.champ=ch;

function runAllStar(){
  const S=G.season, R=standings(), pool=[];
  Object.entries(S.ps).forEach(([id,q])=>{ const p=PBYID[id]; if(!p||q.g<20||p.injury>0) return; const ti=teamOfPlayer(p); if(ti<0) return;
    const g=q.g; pool.push({p, ti, q, cf:TEAMS[ti].conf, sc:q.pts/g+1.1*(q.oreb+q.dreb)/g+1.4*q.ast/g+2*(q.stl+q.blk)/g+.25*p.ovr+5*(R[ti].g?R[ti].w/R[ti].g:.5)}); });
  pool.sort((a,b)=>b.sc-a.sc);
  const AS={};
  ['东','西'].forEach(cf=>{ const c=pool.filter(x=>x.cf===cf), g=c.filter(x=>x.p.pos==='PG'||x.p.pos==='SG'), f=c.filter(x=>!(x.p.pos==='PG'||x.p.pos==='SG'));
    const st=[...g.slice(0,2), ...f.slice(0,3)], rest=c.filter(x=>!st.includes(x)).slice(0,7);
    AS[cf]={starters:st.map(x=>x.p.id), reserves:rest.map(x=>x.p.id)}; });
  // 正赛
  const mk=cf=>{ const ps=[...AS[cf].starters, ...AS[cf].reserves].map(id=>PBYID[id]); const tm={players:ps};
    const rot=E.autoRotation(tm); ps.forEach(p=>rot.minutes[p.id]=20); const tac=Object.assign(E.autoTactics(tm,rot),{pace:'fast',matchups:{}});
    return {players:ps, rotation:rot, tactics:tac, allStar:true}; };

  const bs=E.boxScore(M), win=M.score[0]>M.score[1]?0:1;
  const best=bs[win].players.slice().sort((a,b)=>b.gs-a.gs)[0];
  const top=bs.flatMap(t=>t.players).sort((a,b)=>b.pts-a.pts).slice(0,6).map(x=>({id:x.id, pts:x.pts, reb:x.oreb+x.dreb, ast:x.ast}));
  AS.game={score:M.score.slice(), mvp:best.id, top};
  // 三分大赛
  const shooters=pool.filter(x=>x.q.tpa/x.q.g>=4).sort((a,b)=>(b.p.a.three*.7+b.q.tpm/b.q.tpa*30)-(a.p.a.three*.7+a.q.tpm/a.q.tpa*30)).slice(0,8).map(x=>x.p);
  const shoot=p=>{ const pr=clamp(.25+(p.a.three-60)*.011,.25,.62); let s=0; for(let r=0;r<5;r++) for(let b=0;b<5;b++) if(rnd01()<pr) s+=b===4?2:1; return s; };
  const r1=shooters.map(p=>[p.id,shoot(p)]).sort((a,b)=>b[1]-a[1]||rnd01()-.5);
  const fin=r1.slice(0,3).map(([id])=>[id,shoot(PBYID[id])]).sort((a,b)=>b[1]-a[1]||rnd01()-.5);

  // 扣篮大赛
  const dunkers=pool.filter(x=>ageOf(x.p)<=28).sort((a,b)=>(b.p.a.dunk+b.p.a.jmp)-(a.p.a.dunk+a.p.a.jmp)).slice(0,10);
  const dk=[]; dunkers.forEach(x=>{ if(dk.length<4 && rnd01()<.7) dk.push(x.p); }); dunkers.forEach(x=>{ if(dk.length<4 && !dk.includes(x.p)) dk.push(x.p); });
  const dunk=p=>Math.round(clamp(38+(p.a.dunk+p.a.jmp-150)*.12+gauss(0,4),30,50));
  const d1=dk.map(p=>[p.id,dunk(p)+dunk(p)]).sort((a,b)=>b[1]-a[1]||rnd01()-.5);
  const d2=d1.slice(0,2).map(([id])=>[id,dunk(PBYID[id])+dunk(PBYID[id])]).sort((a,b)=>b[1]-a[1]||rnd01()-.5);
  AS.dunk={r1:d1, fin:d2, w:d2.length?d2[0][0]:null};
  S.allStar=AS;
  // 士气、新闻、收件箱
  const all=[...AS['东'].starters,...AS['东'].reserves,...AS['西'].starters,...AS['西'].reserves];
  all.forEach(id=>setMor(PBYID[id],mor(PBYID[id])+5));
  [AS.three.w, AS.dunk.w, AS.game.mvp].forEach(id=>{ if(id) setMor(PBYID[id],mor(PBYID[id])+3); });
  addNews('全明星',`全明星赛 东部 ${M.score[0]}-${M.score[1]} 西部，MVP ${PBYID[best.id].cn}。三分大赛冠军 ${AS.three.w?PBYID[AS.three.w].cn:'-'}，扣篮大赛冠军 ${AS.dunk.w?PBYID[AS.dunk.w].cn:'-'}`);
  const mine=all.filter(id=>teamOfPlayer(PBYID[id])===G.team).map(id=>PBYID[id].cn);
  S.inbox.push({d:S.day, t:'全明星周末', b:`${mine.length?'你的球队入选：'+mine.join('、')+'。':'你的球队今年没人入选。'}全明星赛 MVP 是 ${PBYID[best.id].cn}。详情在「赛事」页。`});
}

// ================= 比赛跑动动画 =================
// 规范：《第二阶段规范.md》§3。引擎先算出一个回合的结果，这里把结果「演」出来，不影响结果。
// 坐标：全场 94×50 英尺。主队（side 0）一直向右攻，篮筐在 x=88.75；客队向左攻，篮筐在 x=5.25。

const RIM=[88.75, 5.25];
// 落位点：dx = 离篮筐的纵深，lat = 横向（正数在进攻方的右手边）
const SPOTS={
  bal:   {PG:[25,0],  SG:[17,-17], SF:[17,17],  PF:[15,8],  C:[4,-7]},
  motion:{PG:[24,4],  SG:[11,-19], SF:[19,15],  PF:[17,-6], C:[8,7]},
  spread:{PG:[26,0],  SG:[18,-17], SF:[18,17],  PF:[2,-22], C:[2,22]},
  pnr:   {PG:[27,-3], SG:[17,-18], SF:[2,22],   PF:[2,-22], C:[24,2]},
  iso:   {PG:[23,12], SG:[3,22],   SF:[19,-16], PF:[13,21], C:[4,14]},
  post:  {PG:[25,2],  SG:[18,17],  SF:[3,-22],  PF:[17,-14],C:[5,-8]},
};
const ZONE23={PG:[19,-7], SG:[19,7], SF:[7,-13], PF:[7,13], C:[4,0]};
const FTSPOT=[15,0], FT_LANE=[[7,-8],[7,8],[11,-8],[11,8],[26,-10],[26,10],[29,0]];

function toXY(side, dx, lat){ return side===0? [RIM[0]-dx, 25+lat] : [RIM[1]+dx, 25-lat]; }
function fromEvXY(side, e){ return toXY(side, e.y, e.x); }        // 引擎事件的 (x 横向, y 纵深)
function jit(v){ return v+(Math.random()-.5)*2.2; }

// ---------- 场景：一串「瞬间」，渲染时在相邻两个瞬间之间插值 ----------
function captureBefore(M){
  return { poss:M.poss, clock:M.clock, q:M.q,
    on:M.teams.map(T=>T.on.map(m=>({id:m.id, slot:m.slot}))),
    sys:M.teams.map(T=>T.tac.system), def:M.teams.map(T=>T.tac.defense), last:M.last,
    mu:M.teams.map(T=>Object.assign({},T.tac.matchups||{})) };
}
function buildScene(L, B, evs, after){
  const O=B.poss, D=1-O, moments=[];
  const pos=Object.assign({}, L.pos);
  const onO=B.on[O], onD=B.on[D];
  // 新上场的球员从技术台（场边）走进来
  [...onO,...onD].forEach(x=>{ if(!pos[x.id]) pos[x.id]=[47+(Math.random()-.5)*8, 52]; });
  let ball=L.ball? L.ball.slice() : [47,25,0], holder=L.holder;
  const slotOf={}; onO.forEach(x=>slotOf[x.id]=x.slot); onD.forEach(x=>slotOf[x.id]=x.slot);
  const spots=SPOTS[B.sys[O]]||SPOTS.bal;
  const formation=()=>{ const p={}; onO.forEach(x=>{ const s=spots[x.slot]||[20,0]; const xy=toXY(O,s[0],s[1]); p[x.id]=[jit(xy[0]),jit(xy[1])]; }); return p; };
  // 防守：人盯人站在对位人和篮筐之间；联防站区域；紧逼在推进阶段就上抢
  const guard=(offPos, stage)=>{
    const p={}, rim=[RIM[O],25];
    if(B.def[D]==='zone' && stage!=='press'){ onD.forEach(x=>{ const s=ZONE23[x.slot]||[10,0]; const xy=toXY(O,s[0],s[1]); p[x.id]=[jit(xy[0]),jit(xy[1])]; }); return p; }
    const bh = holder && offPos[holder] ? offPos[holder] : null;
    onD.forEach((x,k)=>{
      let tgt=onO.find(o=>B.mu[D][x.id]===o.id) || onO.find(o=>o.slot===x.slot) || onO[k];
      const op=offPos[tgt.id]||[47,25];
      if(stage==='press'){ p[x.id]=[op[0]+(rim[0]-op[0])*.08, op[1]+(rim[1]-op[1])*.08]; return; }
      const onBall = tgt.id===holder;
      const d=Math.hypot(rim[0]-op[0],rim[1]-op[1])||1, gap=Math.min(d*.5, onBall?3.5:6);
      let px=op[0]+(rim[0]-op[0])/d*gap, py=op[1]+(rim[1]-op[1])/d*gap;
      if(!onBall && bh){ px+=(bh[0]-px)*.18; py+=(bh[1]-py)*.18; }        // 无球防守向球收缩
      p[x.id]=[px+(Math.random()-.5)*.6, py+(Math.random()-.5)*.6];
    });
    return p;
  };
  const push=(w, offPos, defPos, ballPos, h, extra)=>{ Object.assign(pos, offPos, defPos, extra||{}); moments.push({w, pos:Object.assign({},pos), ball:ballPos.concat([h||0]), holder}); };
  const at=id=>pos[id];
  const handler=(onO.find(x=>x.slot==='PG')||onO[0]).id;
  let off=formation(), started=false;
  const setup=(fast)=>{
    if(started) return; started=true;
    if(fast){ // 快攻：进攻方直接冲向篮下
      const o={}; onO.forEach(x=>{ const cur=pos[x.id]; const xy=toXY(O, 18+Math.random()*20, (Math.random()-.5)*30); o[x.id]=[ (cur[0]+xy[0])/2, (cur[1]+xy[1])/2 ]; });
      holder=handler; push(.8,o,guard(o,'press'),at(handler)||[47,25]); return; }
    // 推进：持球人过半场，其他人往落位点跑
    const mid={}; onO.forEach(x=>{ const cur=pos[x.id], t=off[x.id]; mid[x.id]=[ cur[0]+(t[0]-cur[0])*.55, cur[1]+(t[1]-cur[1])*.55 ]; });
    holder=handler; const hp=mid[handler];
    push(1.0, mid, guard(mid, B.def[D]==='press'?'press':'half'), hp);
    holder=handler; push(.9, off, guard(off,'half'), off[handler]);
  };
  const ftLayout=(shooter)=>{
    const o={}, d={}; const s=toXY(O,FTSPOT[0],FTSPOT[1]); o[shooter]=[s[0],s[1]];
    const others=[...onO.filter(x=>x.id!==shooter).map(x=>x.id), ...onD.map(x=>x.id)]; let k=0;
    const dl=onD.map(x=>x.id);
    others.forEach(id=>{ const sp=FT_LANE[k%FT_LANE.length]; const xy=toXY(O,sp[0],sp[1]); (dl.includes(id)?d:o)[id]=[xy[0],xy[1]]; k++; });
    return [o,d];
  };
  let firstShot=true;
  for(let i=0;i<evs.length;i++){
    const e=evs[i];
    if(e.type==='made'||e.type==='miss'||e.type==='blk'||e.type==='sfoul'){
      const fast = e.shot==='fast';
      const putback = e.shot==='putback';
      if(!putback) setup(fast);
      const sh=e.pid, spot=e.x!=null? fromEvXY(O,e): at(sh);
      // 传球：持球人 → 助攻人 → 出手人
      if(!putback){
        if(e.ast && e.ast!==holder){ holder=e.ast; push(.45, off, guard(off,'half'), at(e.ast)||off[e.ast]||[47,25], 3); }
        if(holder!==sh){ holder=sh; push(.45, off, guard(off,'half'), off[sh]||at(sh), 3); }
      }
      // 出手人移动到出手点，防守人贴上去
      const o2=Object.assign({}, putback? {} : off); o2[sh]=spot.slice();
      const d2=putback? {} : guard(o2,'half');
      const dfd = e.by && e.type==='blk' ? e.by : (e.type==='sfoul'?e.by:null);
      if(dfd){ d2[dfd]=[spot[0]+(RIM[O]-spot[0])*.12, spot[1]+(25-spot[1])*.12]; }
      holder=sh; push(putback?.3:.55, o2, d2, spot, 1);
      // 出手
      holder=null;
      if(e.type==='blk'){ const mid=[spot[0]+(RIM[O]-spot[0])*.25, spot[1]+(25-spot[1])*.25]; push(.3,{},{},mid,6); const away=[mid[0]+(Math.random()-.5)*12, mid[1]+(Math.random()-.5)*12]; push(.3,{},{},away,0); ball=away; }
      else if(e.type==='sfoul'){ push(.3,{},{},[spot[0]+(RIM[O]-spot[0])*.4, spot[1]+(25-spot[1])*.4],7); }
      else {
        const dist=Math.hypot(RIM[O]-spot[0],25-spot[1]);
        push(fast||putback?.3:.25+dist/90, {}, {}, [RIM[O],25], 12);          // 球飞到篮筐
        if(e.type==='made'){ push(.3,{},{},[RIM[O]+(O===0?-.5:.5),25],0); }
        else { const bounce=[RIM[O]+(O===0?-1:1)*(3+Math.random()*6), 25+(Math.random()-.5)*14]; push(.2,{},{},bounce,6); ball=bounce; }
      }
      firstShot=false; continue;
    }
    if(e.type==='oreb'||e.type==='dreb'){
      const target = moments.length? moments[moments.length-1].ball.slice(0,2) : [RIM[O]+(O===0?-4:4),25];
      const r={}; r[e.pid]=target; holder=e.pid; push(.35,{},{},target,0,r); continue;
    }
    if(e.type==='stl'||e.type==='tov'){
      setup(false);
      if(e.type==='stl'){ const s=at(e.by)||[47,25]; const p=at(e.pid)||[47,25]; const mid=[(s[0]+p[0])/2,(s[1]+p[1])/2]; const r={}; r[e.by]=mid; holder=e.by; push(.45,{},{},mid,0,r); }
      else { const out=[at(holder||handler)[0], Math.random()<.5?-1:51]; holder=null; push(.45,{},{},out,0); }
      continue;
    }
    if(e.type==='ft'){
      const [o,d]=ftLayout(e.pid); holder=e.pid; const s=o[e.pid];
      push(.6,o,d,s,1);
      for(let k=0;k<e.n;k++){ holder=null; push(.35,{},{},[RIM[O],25],10); push(.2,{},{},k<e.made?[RIM[O]+(O===0?-.5:.5),25]:[RIM[O]+(O===0?-3:3),25+(Math.random()-.5)*6],0); if(k<e.n-1){ holder=e.pid; push(.25,{},{},s,1); } }
      continue;
    }
    if(e.type==='pf'||e.type==='ifoul'){ setup(false); const who=e.type==='ifoul'?e.on:holder||handler; const d={}; const tp=at(who)||[47,25]; d[e.pid]=[tp[0]+1,tp[1]+1]; push(.4,{},d,tp,0); continue; }
  }
  if(!moments.length){ setup(false); }
  // 结尾保留 0.2 让画面停一下
  moments.push(Object.assign({}, moments[moments.length-1], {w:.25}));
  const total=moments.reduce((s,m)=>s+m.w,0); let acc=0;
  moments.forEach(m=>{ acc+=m.w; m.t=acc/total; });
  // 事件在最后一次出手落地时揭晓
  let revealAt=.88;
  return {moments, start:{pos:Object.assign({},L.pos), ball:(L.ball||[47,25,0]).slice(), holder:L.holder}, revealAt, clock0:B.clock, clock1:after.clock, q:B.q, sides:[B.on[0].map(x=>x.id),B.on[1].map(x=>x.id)]};
}

// ---------- 渲染 ----------
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function frameAt(sc, t){
  const ms=sc.moments; let prev={t:0,pos:sc.start.pos,ball:sc.start.ball,holder:sc.start.holder}, next=ms[0];
  for(let i=0;i<ms.length;i++){ if(t<=ms[i].t){ next=ms[i]; prev=i?ms[i-1]:prev; break; } prev=ms[i]; next=ms[i]; }
  const span=Math.max(1e-6,next.t-prev.t), u=ease(clamp((t-prev.t)/span,0,1));
  const pos={}; const ids=new Set([...Object.keys(next.pos||{}), ...Object.keys(prev.pos||{})]);
  ids.forEach(id=>{ const a=(prev.pos||{})[id]||(next.pos||{})[id], b=(next.pos||{})[id]||a; pos[id]=[a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u]; });
  const a=prev.ball||[47,25,0], b=next.ball||a;
  let bx=a[0]+(b[0]-a[0])*u, by=a[1]+(b[1]-a[1])*u, bh=(a[2]||0)+((b[2]||0)-(a[2]||0))*u;
  if((b[2]||0)>=10) bh = Math.sin(u*Math.PI)*6 + (b[2]||0)*u;       // 投篮弧线
  const holder = u>.85? next.holder : prev.holder;
  if(holder && pos[holder]){ bx=pos[holder][0]+.9; by=pos[holder][1]-.6; bh=1; }
  return {pos, ball:[bx,by,bh], holder};
}

function drawCourt(){
  const c=document.getElementById('court'); if(!c||!LIVE) return; const g=c.getContext('2d'), W=c.width, H=c.height, k=W/94;
  const X=v=>v*k, Y=v=>v*k;
  g.clearRect(0,0,W,H); g.fillStyle='#3a2a1c'; g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(255,240,220,.5)'; g.lineWidth=Math.max(1.5,k*.16);
  g.strokeRect(X(0),Y(0),X(94),Y(50));
  g.beginPath(); g.moveTo(X(47),0); g.lineTo(X(47),Y(50)); g.stroke();
  g.beginPath(); g.arc(X(47),Y(25),X(6),0,Math.PI*2); g.stroke();
  [[94,-1],[0,1]].forEach(([base,dir])=>{
    const bx=base+dir*5.25;
    g.fillStyle='rgba(255,138,31,.09)'; g.fillRect(X(Math.min(base,base+dir*19)),Y(17),X(19),Y(16)); g.strokeRect(X(Math.min(base,base+dir*19)),Y(17),X(19),Y(16));
    g.beginPath(); g.arc(X(base+dir*19),Y(25),X(6),0,Math.PI*2); g.stroke();
    g.beginPath(); g.moveTo(X(base),Y(3)); g.lineTo(X(base+dir*14),Y(3)); g.stroke();
    g.beginPath(); g.moveTo(X(base),Y(47)); g.lineTo(X(base+dir*14),Y(47)); g.stroke();
    const a=Math.asin(22/23.75); g.beginPath();
    for(let t=-a;t<=a+1e-6;t+=a/40){ const x=bx+dir*Math.cos(t)*23.75, y=25+Math.sin(t)*23.75; t===-a?g.moveTo(X(x),Y(y)):g.lineTo(X(x),Y(y)); } g.stroke();
    g.strokeStyle='#ff8a1f'; g.beginPath(); g.arc(X(bx),Y(25),X(.75),0,Math.PI*2); g.stroke();
    g.beginPath(); g.moveTo(X(base+dir*4),Y(22)); g.lineTo(X(base+dir*4),Y(28)); g.stroke(); g.strokeStyle='rgba(255,240,220,.5)';
  });
  const M=LIVE.M;
  // 本节出手点（淡）
  g.globalAlpha=.45;
  LIVE.dots.forEach(d=>{ if(d.q!==M.q && !M.done) return; const xy=fromEvXY(d.t,d); const col=colorOf(teamOf(d.t),d.t);
    g.beginPath(); g.arc(X(xy[0]),Y(xy[1]),X(.6),0,Math.PI*2); if(d.made){ g.fillStyle=col; g.fill(); } else { g.strokeStyle=col; g.lineWidth=Math.max(1,k*.12); g.stroke(); } });
  g.globalAlpha=1;
  // 球员和球
  const fr=LIVE.frame; if(!fr) return;
  const sides=LIVE.scene? LIVE.scene.sides : M.teams.map(T=>T.on.map(m=>m.id));
  sides.forEach((ids,s)=>{ const col=colorOf(teamOf(s),s);
    ids.forEach(id=>{ const p=fr.pos[id]; if(!p) return; const pl=PBYID[id];
      g.beginPath(); g.arc(X(p[0]),Y(p[1]),X(1.45),0,Math.PI*2); g.fillStyle=col; g.fill();
      g.lineWidth=Math.max(1.5,k*.14); g.strokeStyle= fr.holder==id? '#ffffff' : 'rgba(0,0,0,.55)'; g.stroke();
      if(fr.holder==id){ g.beginPath(); g.arc(X(p[0]),Y(p[1]),X(2.1),0,Math.PI*2); g.strokeStyle='rgba(255,255,255,.7)'; g.stroke(); }
      g.fillStyle=lumOf(col)>150?'#111':'#fff'; g.font=`bold ${Math.round(X(1.35))}px -apple-system,sans-serif`; g.textAlign='center'; g.textBaseline='middle';
      g.fillText(pl&&pl.jersey!=null&&pl.jersey!==''?pl.jersey:sn(pl||{cn:'?'}).slice(0,1), X(p[0]), Y(p[1])+1);
      if(LIVE.showNames){ g.font=`${Math.round(X(1.1))}px -apple-system,sans-serif`; g.fillStyle='rgba(255,255,255,.85)'; g.fillText(sn(pl), X(p[0]), Y(p[1]+2.5)); }
    }); });
  const b=fr.ball; const r=.62+b[2]*.05;
  g.beginPath(); g.arc(X(b[0]),Y(b[1]+.25),X(.55),0,Math.PI*2); g.fillStyle='rgba(0,0,0,.35)'; g.fill();
  g.beginPath(); g.arc(X(b[0]),Y(b[1]-b[2]*.12),X(r),0,Math.PI*2); g.fillStyle='#ff8a1f'; g.fill(); g.strokeStyle='#3a1a00'; g.lineWidth=Math.max(1,k*.08); g.stroke();
}
function lumOf(h){ const n=parseInt(h.slice(1),16); return .299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255); }

// ---------- 播放循环（替换 app_main 里的版本） ----------
function sceneDur(){ return 2300/LIVE.speed; }
function tick(now){
  const L=LIVE; if(!L || !L.playing) return;
  const M=L.M;
  if(L.speed>=8){ // 8x：不播动画
    const dt=now-L.last; L.last=now; L.acc+=dt; let n=0;
    while(L.acc>=120 && !M.done && n<3){ L.acc-=120; E.step(M); n++; }
    L.revealTo=null; L.scene=null; L.frame=idleFrame(); if(n) updLive();
    if(M.done){ finishLive(); return; } L.raf=requestAnimationFrame(tick); return;
  }
  if(!L.scene || now-L.sceneStart>=L.sceneLen){
    if(L.scene){ const end=frameAt(L.scene,1); L.pos=end.pos; L.ball=end.ball; L.holder=end.holder; L.revealTo=null; updLive(); }
    if(M.done){ finishLive(); return; }
    const B=captureBefore(M), n0=M.events.length;
    E.step(M);
    const evs=M.events.slice(n0).filter(e=>e.type!=='sub'&&e.type!=='timeout'&&e.type!=='eoq'&&e.type!=='injury'&&e.type!=='foulout');
    L.scene=buildScene(L,B,evs,{clock:M.clock});
    const weight=Math.min(1.6, Math.max(.45, L.scene.moments.reduce((s,m)=>s+m.w,0)/3.2));
    L.sceneLen=sceneDur()*weight; L.sceneStart=now; L.revealTo=n0; L.sceneEvStart=n0;
  }
  const t=clamp((now-L.sceneStart)/L.sceneLen,0,1);
  L.frame=frameAt(L.scene,t);
  if(t>=L.scene.revealAt && L.revealTo!==null){ L.revealTo=null; updLive(); }
  // 比赛时钟随动画走
  const clk=document.getElementById('clk'); if(clk && !M.done){ const c=L.scene.clock0+(Math.max(0,L.scene.clock1)-L.scene.clock0)*t; clk.innerHTML=`<b>${clockTxt(L.scene.q, c<0?0:c)}</b>`; }
  drawCourt();
  L.raf=requestAnimationFrame(tick);
}
function idleFrame(){ const M=LIVE.M, pos={}; M.teams.forEach((T,s)=>T.on.forEach(m=>{ const sp=(SPOTS[T.tac.system]||SPOTS.bal)[m.slot]||[20,0]; const side=M.poss; const xy= s===side? toXY(side,sp[0],sp[1]) : toXY(side,sp[0]*.7,sp[1]*.8); pos[m.id]=xy; }));
  const h=M.teams[M.poss].on[0]; return {pos, ball:[pos[h.id][0]+.9,pos[h.id][1]-.6,1], holder:h.id}; }
function simToEnd(){ if(!LIVE) return; stopLive(); E.run(LIVE.M); LIVE.revealTo=null; LIVE.scene=null; LIVE.frame=idleFrame(); updLive(); finishLive(); }

function tipFrame(M){ // 开场跳球：两名中锋在中圈，其余人围在中圈外
  const pos={}; M.teams.forEach((T,s)=>T.on.forEach((m,k)=>{ const dir=s===0?-1:1;
    if(m.slot==='C'){ pos[m.id]=[47+dir*1.3,25]; return; }
    const ang=[-.9,-.35,.35,.9][k%4]; pos[m.id]=[47+dir*(8+Math.cos(ang)*3), 25+Math.sin(ang)*14]; }));
  return {pos, ball:[47,25,3], holder:null};
}

// 手动存档位放 IndexedDB（一个存档接近 1 MB，localStorage 放不下几个），IndexedDB 不可用时退回 localStorage。
const SAVE_KEYS=[SAVE_KEY, WORLD_KEY, SEASON_KEY];

const IDB={db:null};
function idbOpen(){ return new Promise((res,rej)=>{ if(IDB.db) return res(IDB.db); if(!window.indexedDB) return rej(new Error('no idb'));
  const r=indexedDB.open('bbm_saves',1); r.onupgradeneeded=()=>r.result.createObjectStore('slots'); r.onsuccess=()=>{ IDB.db=r.result; res(IDB.db); }; r.onerror=()=>rej(r.error); }); }

  catch(e){ localStorage.setItem('bbm_slot_'+k, JSON.stringify(v)); } }
async function slotGet(k){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const q=db.transaction('slots').objectStore('slots').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); }
  catch(e){ try{ return JSON.parse(localStorage.getItem('bbm_slot_'+k)||'null'); }catch(_){ return null; } } }
async function slotDel(k){ try{ const db=await idbOpen(); await new Promise(res=>{ const tx=db.transaction('slots','readwrite'); tx.objectStore('slots').delete(k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} try{ localStorage.removeItem('bbm_slot_'+k); }catch(e){} }

  return `<div class="card"><h3>存档位</h3>${S.map((s,k)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1f2733;flex-wrap:wrap">

      <div>${canSave?`<button class="sm pri" data-ss="${k+1}">存到这里</button> `:''}${s?`<button class="sm" data-sl="${k+1}">读取</button> <button class="sm" data-sd="${k+1}">删除</button>`:''}</div></div>`).join('')}
    <p class="hint" style="margin-top:8px">存档位只在这台设备的这个浏览器里。换手机、换电脑，或者清理浏览器数据之前，先导出存档文件。</p>
    <div style="margin-top:10px">${canSave?'<button id="exportsave">导出存档文件</button> ':''}<button id="importbtn">导入存档文件</button><input type="file" id="importfile" accept=".json,application/json" style="display:none"></div></div>`;
}
function bindSave(v, rerender){
  v.querySelectorAll('[data-ss]').forEach(b=>b.onclick=async()=>{ const k='s'+b.dataset.ss, old=await slotGet(k);
    if(old && !confirmSafe(`存档位 ${b.dataset.ss} 已经有存档，覆盖吗？`)) return; await slotPut(k, snapshot()); toast(`已存到存档位 ${b.dataset.ss}`); rerender(); });
  v.querySelectorAll('[data-sl]').forEach(b=>b.onclick=async()=>{ const s=await slotGet('s'+b.dataset.sl); if(!s) return;
    if(G.team!=null && !confirmSafe('读档会替换当前进度，没存的部分会丢。确定吗？')) return; try{ restore(s); }catch(e){ toast('这个存档读不出来'); } });
  v.querySelectorAll('[data-sd]').forEach(b=>b.onclick=async()=>{ if(!confirmSafe(`删除存档位 ${b.dataset.sd}？`)) return; await slotDel('s'+b.dataset.sd); rerender(); });
  const q=s=>v.querySelector(s);
  if(q('#exportsave')) q('#exportsave').onclick=exportSave;
  if(q('#importbtn')) q('#importbtn').onclick=()=>q('#importfile').click();
  if(q('#importfile')) q('#importfile').onchange=e=>{ const f=e.target.files[0]; if(f) importSave(f); e.target.value=''; };
  if(q('#copywx')) q('#copywx').onclick=copyWx;
  if(q('#newgame')) q('#newgame').onclick=newGame;
  bindInstallCard(v);
}
async function vSave(v){
  const s=G.season, t=myTeam();
  v.innerHTML=`<h1>存档</h1><div class="sub">每一步操作都会自动保存，关掉再打开会接着玩。想留几个进度来回切，用下面的存档位。</div><div id="savebody"><div class="hint">读取中…</div></div>`;
  const html=await slotsHTML(true);
  if(G.view!=='save') return;
  v.querySelector('#savebody').innerHTML=`${html}
    <div class="card"><h3>新开一局</h3><p class="hint" style="margin-bottom:8px">放弃当前进度，回到 2026-27 赛季季前重新选队。手动存档位里的存档不受影响。</p><button class="sm" id="newgame" style="border-color:var(--bad);color:var(--bad)">新开一局</button></div>
    ${installCardHTML()}${contactHTML()}`;
  bindSave(v, ()=>vSave(v));
}
// 选队页：读档、导入、联系方式
async function pickExtras(v){
  const box=v.querySelector('#pickextra'); if(!box) return;
  box.innerHTML=`${await slotsHTML(false)}${installCardHTML()}${contactHTML()}`;
  bindSave(box, ()=>pickExtras(v));
}

// ---------- 手机上关掉缩放 ----------
(function lockZoom(){
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('touchmove',e=>{ if(e.touches && e.touches.length>1) e.preventDefault(); },{passive:false});
})();

load(); render();
