<style>
:root{
  --bg:#0d1117; --bg2:#151b24; --bg3:#1c2430; --line:#2a3441;
  --txt:#e6edf3; --dim:#8b98a8; --dim2:#5f6b7a;
  --acc:#ff8a1f; --acc2:#c9620a; --warn:#f0a020; --bad:#e5484d; --good:#00c276; --info:#4a9eff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:var(--bg2);-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:pan-x pan-y}
body{background:var(--bg2);color:var(--txt);font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(255,138,31,.18)}
input,select{-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#333d4b;border-radius:5px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:calc(52px + var(--sat));flex:0 0 calc(52px + var(--sat));background:linear-gradient(180deg,#1b2430,#141b24);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:var(--sat) calc(14px + var(--sar)) 0 calc(14px + var(--sal))}
#tb-name{font-weight:700;font-size:14px;line-height:1.15}#tb-name small{display:block;font-weight:400;font-size:11px;color:var(--dim)}
#tb-spacer{flex:1}#tb-stats{display:flex}
.tb-stat{text-align:center;padding:0 10px;border-left:1px solid var(--line);min-width:70px}.tb-stat b{display:block;font-size:13px}.tb-stat span{font-size:10px;color:var(--dim)}
#main{flex:1;display:flex;min-height:0;background:var(--bg)}
#side{width:calc(150px + var(--sal));flex:0 0 calc(150px + var(--sal));background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:6px 0 var(--sab) var(--sal)}
.nav{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;color:var(--dim);border-left:3px solid transparent;font-size:13px}
.nav:hover{background:var(--bg3);color:var(--txt)}.nav.on{background:var(--bg3);color:var(--acc);border-left-color:var(--acc);font-weight:600}
.nav svg{width:16px;height:16px;flex:0 0 16px}
#view{flex:1;min-width:0;overflow-y:auto;padding:16px calc(18px + var(--sar)) calc(40px + var(--sab)) 18px}
@media(min-width:1500px){#view>*{max-width:1380px;margin-left:auto;margin-right:auto}}
h1{font-size:19px;font-weight:700;margin-bottom:3px}h2{font-size:15px;margin:16px 0 8px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card>h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card>h3 .r{margin-left:auto;font-weight:400;color:var(--dim);font-size:12px}
.row{display:flex;gap:14px;flex-wrap:wrap}.col{flex:1;min-width:0}
.tw{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 7px;border-bottom:1px solid #1f2733;white-space:nowrap}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--bg3)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
button{font:inherit;background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer}
button:hover{border-color:#3c4a5c}button.pri{background:var(--acc);border-color:var(--acc);color:#1a0f00;font-weight:700}
button.pri:hover{background:#ff9a3c}button.sm{padding:4px 9px;font-size:12px}button:disabled{opacity:.4;cursor:default}
button.on{border-color:var(--acc);color:var(--acc);background:#2a1c10}
select,input[type=number]{font:inherit;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
input[type=number]{width:58px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);background:var(--bg)}
.seg button:last-child{border-right:0}.seg button.on{background:#2a1c10;color:var(--acc)}
.pill{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;font-weight:700;line-height:18px}
.hint{color:var(--dim);font-size:12px}
.logo{display:inline-block;background-image:url(logos.png);background-size:600% 500%;background-repeat:no-repeat;vertical-align:middle;flex:0 0 auto}
.ovr{display:inline-block;min-width:28px;text-align:center;border-radius:4px;font-weight:700;font-size:12px;padding:0 4px;color:#111}
.bar{height:5px;background:#26303c;border-radius:3px;overflow:hidden;min-width:40px}.bar i{display:block;height:100%}
/* 选队 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.tcard:hover{border-color:var(--acc)}.tcard b{display:block;font-size:13px}.tcard span{font-size:11px;color:var(--dim)}
/* 球员详情 */
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px}
.attr{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed #222b36}
/* 比赛 */
#scoreboard{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px;background:linear-gradient(180deg,#1b2430,#121820);border-radius:8px 8px 0 0}
#scoreboard .tn{font-weight:700;font-size:15px;min-width:90px}#scoreboard .tn.a{text-align:right}
#scoreboard .sc{white-space:nowrap;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px;min-width:120px;text-align:center}
#sbinfo{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--dim);padding:5px;background:#121820;border-radius:0 0 8px 8px;border-top:1px solid var(--line)}
#sbinfo b{color:var(--txt)}
#courtwrap{position:relative;margin-top:10px}#court{width:100%;display:block;border-radius:6px;background:#1a1410}
#pbp{max-height:430px;overflow-y:auto;font-size:13px}
#pbp div{padding:5px 8px;border-bottom:1px solid #1f2733;display:flex;gap:8px}
#pbp div .t{color:var(--dim2);font-variant-numeric:tabular-nums;flex:0 0 64px;font-size:12px}
#pbp div.sc{background:#161d27}#pbp div.q{color:var(--acc);font-weight:700;justify-content:center}
.ctrl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal>.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto}
.selrow{cursor:pointer}.selrow.sel td{background:#2a1c10}
.fitbar{display:flex;align-items:center;gap:6px}
.syscard{border:1px solid var(--line);border-radius:7px;padding:9px 10px;cursor:pointer;background:var(--bg)}
.syscard.on{border-color:var(--acc);background:#2a1c10}.syscard b{font-size:13px}.syscard p{font-size:11px;color:var(--dim);margin-top:2px}
.sysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.short{display:none}.seg{justify-self:start}
.warn{color:var(--warn)}.bad{color:var(--bad)}.good{color:var(--good)}
@media(max-width:760px){
  #main{flex-direction:column-reverse}
  #side{width:100%;flex:0 0 auto;display:grid;grid-template-columns:repeat(var(--navcols,9),1fr);border-right:0;border-top:1px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal);overflow:visible}
  .nav{min-width:0;white-space:nowrap;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 0 5px;border-left:0;border-top:2px solid transparent;justify-content:center;letter-spacing:-.2px}
  .nav svg{width:17px;height:17px;flex:0 0 17px}
  .nav.on{border-top-color:var(--acc)}
  #view{padding:12px}
  .tb-stat{display:none}
  #scoreboard .tn{min-width:0;font-size:13px}#scoreboard .sc{font-size:24px;min-width:90px}
  #scoreboard .full{display:none}#scoreboard .short{display:inline}#scoreboard{gap:8px}#sbinfo{gap:10px}
}
</style>
</head>

let C = {rim:.7,post:.6,mid:.7,three:.68,handle:.65,passing:.62,drawFoul:.7,perDef:.66,intDef:.62,block:.5,blockMax:.7,steal:.6,spd:.65,oreb:.5,dreb:.6,hand3:.72};
function setCenters(teams){
  const ps=[]; teams.forEach(t=>t.players.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,9).forEach(p=>ps.push(composite(p))));
  const m=k=>ps.reduce((s,c)=>s+c[k],0)/ps.length; const out={};
  ['rim','post','mid','three','handle','passing','drawFoul','perDef','intDef','block','steal','spd','oreb','dreb'].forEach(k=>out[k]=m(k));
  out.blockMax=teams.reduce((s,t)=>s+Math.max(...t.players.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,5).map(p=>composite(p).block)),0)/teams.length;
  out.hand3=teams.reduce((s,t)=>{const v=t.players.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,5).map(p=>{const c=composite(p);return (c.handle+c.passing)/2;}).sort((a,b)=>b-a).slice(0,3);return s+v.reduce((a,b)=>a+b,0)/3;},0)/teams.length;
  C=out;
  out.sys={};
  const tops=teams.map(t=>t.players.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,5).map(p=>Object.assign(composite(p),{oiqRaw:p.a.oiq/100})));
  ['pnr','iso','post','motion','spread'].forEach(k=>{ const v=tops.map(cs=>sysRaw(k,cs)); const m=v.reduce((a,b)=>a+b,0)/v.length;
    out.sys[k]={m, sd:Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)||.05}; });
  return out;
}

const POS = ['PG','SG','SF','PF','C'];
const POS_I = {PG:0,SG:1,SF:2,PF:3,C:4};
const SYSTEMS = {
  bal:   {name:'均衡', w:{}, exp:6,   ast:1,    tov:1},
  pnr:   {name:'挡拆', w:{rim:1.25, mid:1.15}, exp:6, ast:1.08, tov:1.02},
  iso:   {name:'孤立', w:{mid:1.3, rim:1.1, three:.9}, exp:8, ast:.8, tov:.92},
  post:  {name:'背身', w:{post:2.2, three:1.05}, exp:6.5, ast:.9, tov:1.03},
  motion:{name:'传切', w:{rim:1.2, three:1.05}, exp:4.5, ast:1.15, tov:1.06},
  spread:{name:'五外', w:{three:1.35, rim:1.1, post:.4, mid:.7}, exp:5.5, ast:1.05, tov:1},
};
const PACE = {slow:1.12, mid:1, fast:.88};

// ================= 工具 =================
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
function pickW(rng, arr, wf){ let s=0; const w=arr.map(x=>{const v=Math.max(0,wf(x)); s+=v; return v;});
  if(s<=0) return arr[Math.floor(rng()*arr.length)]; let r=rng()*s; for(let i=0;i<arr.length;i++){ r-=w[i]; if(r<=0) return arr[i]; } return arr[arr.length-1]; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function posFit(p, slot){
  if(p.pos===slot) return 1;
  if((p.pos2||[]).includes(slot)) return .9;
  const d=Math.abs(POS_I[p.pos]-POS_I[slot]);
  return d===1? .75 : .5;
}
const fitMul = f => .85 + .15*f;

// 总评：位置线性权重 + 三次拉伸（数据来自 real_data.js 的 OVR_W / OVR_STRETCH）
function ovrOf(p, OVR_W, OVR_STRETCH, KEYS){
  const [b,w]=OVR_W[p.pos]; let x=b; KEYS.forEach((k,i)=>x+=w[i]*p.a[k]);
  const f=v=>OVR_STRETCH.reduce((y,c)=>y*v+c,0);
  // 三次拉伸只在真实球员的区间里拟合过，低于 66 以后曲线会往回翘，改成直线外推
  const y = x>=66? f(x) : f(66)+(x-66)*0.8;
  return clamp(Math.round(y),25,99);
}

// ================= 合成能力 =================
function composite(p){
  const a=k=>p.a[k]/100;
  const H=clamp((p.ht-185)/40,0,1), W=clamp((p.ws-p.ht+5)/20,0,1);
  const reb=(k)=>.55*a(k)+.15*H+.10*a('jmp')+.10*a('str')+.10*a('hustle');
  const c={
    rim: .45*a('finish')+.20*a('dunk')+.10*a('jmp')+.10*a('str')+.15*H,
    post:.50*a('post')+.20*a('str')+.15*H+.15*a('oiq'),
    mid: .75*a('mid')+.25*a('oiq'),
    three:.80*a('three')+.20*a('oiq'),
    ft: a('ft'),
    handle:.70*a('handle')+.30*a('spd'),
    passing:.70*a('pass')+.30*a('oiq'),
    drawFoul:.55*a('finish')+.20*a('str')+.15*a('oiq')+.10*a('spd'),
    perDef:.55*a('perD')+.20*a('spd')+.15*a('diq')+.10*W,
    intDef:.50*a('intD')+.15*a('str')+.15*H+.20*a('diq'),
    block:.55*a('blk')+.15*a('jmp')+.15*H+.15*W,
    steal:.70*a('stl')+.30*a('diq'),
    oreb:reb('oreb'), dreb:reb('dreb'),
    spd:a('spd'), sta:a('sta'), H,
  };
  c.usage=.25*c.rim+.15*c.mid+.25*c.three+.10*c.post+.15*c.handle+.10*a('oiq');
  return c;
}

// ================= AI 默认设置 =================
function perms(a){ if(a.length<=1) return [a]; const out=[]; a.forEach((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).forEach(r=>out.push([x].concat(r)))); return out; }
const PERM5 = perms([0,1,2,3,4]);
function combos(arr,k,start=0,cur=[],out=[]){ if(cur.length===k){out.push(cur.slice());return out;} for(let i=start;i<arr.length;i++){cur.push(arr[i]);combos(arr,k,i+1,cur,out);cur.pop();} return out; }

function autoRotation(team){
  const avail=team.players.filter(p=>!(p.injury>0));
  const byOvr=avail.slice().sort((x,y)=>y.ovr-x.ovr);
  const pool=byOvr.slice(0,8);
  let best=null, bestS=-1e9;
  for(const set of combos(pool,5)){
    for(const pm of PERM5){
      let s=0; for(let i=0;i<5;i++){ const pl=set[pm[i]]; s+=pl.ovr-(1-posFit(pl,POS[i]))*22; }
      if(s>bestS){bestS=s; best=pm.map(j=>set[j]);}
    }
  }
  const starters=best.map(p=>p.id);
  const bench=byOvr.filter(p=>!starters.includes(p.id));
  const minutes={}; const sMin=[36,34,32,30,28];
  best.slice().sort((x,y)=>y.ovr-x.ovr).forEach((p,i)=>minutes[p.id]=sMin[i]);
  const bMin=[26,22,18,10,4];
  bench.forEach((p,i)=>minutes[p.id]=bMin[i]||0);
  // 合计补到 240
  let tot=Object.values(minutes).reduce((a,b)=>a+b,0), ids=[...starters, ...bench.map(p=>p.id)], i=0;
  while(tot!==240 && i<200){ const id=ids[i%7]; const d=tot<240?1:-1; if(minutes[id]+d>=0 && minutes[id]+d<=40){minutes[id]+=d; tot+=d;} i++; }
  team.players.forEach(p=>{ if(minutes[p.id]==null) minutes[p.id]=0; });
  return {starters, order:bench.map(p=>p.id), minutes};
}

// 体系契合度：先算原始分，再和联盟各队首发五人的分布比较（setCenters 里统计均值和标准差）
function sysRaw(sys, comps){
  const n3=comps.filter(c=>c.three>=C.three+.04).length;
  const avg=k=>comps.reduce((s,c)=>s+c[k],0)/comps.length;
  switch(sys){
    case 'pnr': return Math.max(...comps.map(c=>(c.handle+c.passing)/2)) + Math.max(...comps.map(c=>(c.rim+c.H)/2));
    case 'iso': { const u=comps.map(c=>c.usage).sort((x,y)=>y-x); return u[0]+.5*(u[0]-u[1]); }
    case 'post': return Math.max(...comps.map(c=>c.post)) + .03*Math.min(n3,3);
    case 'motion': return comps.reduce((s,c)=>s+(c.passing+c.oiqRaw)/2,0)/comps.length;
    case 'spread': return avg('three') + .02*n3;
    default: return 0;
  }
}
function systemFit(sys, comps){
  if(sys==='bal' || !C.sys || !C.sys[sys]) return .5;
  const r=sysRaw(sys,comps), st=C.sys[sys];
  return clamp(.5+(r-st.m)/(2.5*st.sd),0,1);
}

function autoTactics(team, rot){
  const st=rot.starters.map(id=>team.players.find(p=>p.id===id));
  const comps=st.map(p=>Object.assign(composite(p),{oiqRaw:p.a.oiq/100}));
  let bestSys='bal', bestF=.25;   // 所有体系都不比联盟平均高 0.25 个标准差，就打均衡
  for(const s of ['pnr','iso','post','motion','spread']){ const st=C.sys&&C.sys[s]; const z=st?(sysRaw(s,comps)-st.m)/st.sd:0; if(z>bestF){bestF=z; bestSys=s;} }
  const stars=st.slice().sort((x,y)=>y.ovr-x.ovr).slice(0,1).map(p=>p.id);
  return {pace:'mid', system:bestSys, focus:'bal', stars, defense:'man', reb:'bal', matchups:{}, pnrD:'std', double:null, smallOn:false};
}

// ================= 比赛 =================
function createMatch(home, away, opts){
  opts=opts||{};
  const rng = opts.rng || mulberry32((opts.seed>>>0) || (Math.random()*4294967296)>>>0);
  const M={ rng, record:!!opts.record, neutral:!!opts.neutral,
    q:1, clock:720, done:false, ot:0, score:[0,0], qScore:[[],[]],
    poss: rng()<.5?0:1, first:null, teams:[], events:[],
    timeouts:[7,7], teamFouls:[0,0], last:null, run:[0,0], lastScorer:-1,
    lead:{max:[0,0], changes:0, prevSign:0}, tip:null };
  { let z=0; for(let k=0;k<6;k++) z+=rng(); M.pace=1+(z-3)*Math.sqrt(2)*P.gamePaceSD; }
  M.first=M.poss;
  [home,away].forEach((tm,side)=>{
    const rot=tm.rotation||autoRotation(tm);
    const tac=Object.assign({pace:'mid',system:'bal',focus:'bal',stars:[],defense:'man',reb:'bal',matchups:{},pnrD:'std',double:null,smallOn:false}, tm.tactics||autoTactics(tm,rot));
    if(tac.defense==='zone') tac.defense='zone23';
    const men=tm.players.map(p=>({ id:p.id, p, c:composite(p), oiq:p.a.oiq/100, energy:clamp(p.energy!=null?p.energy:1,.5,1), mul:p.formMul||1,
      target:(rot.minutes[p.id]||0)*60, secs:0, slot:null, out:!!(p.injury>0), inj:false,
      pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,tov:0,pf:0,pm:0,
      starter:rot.starters.includes(p.id) }));
    const byId={}; men.forEach(m=>byId[m.id]=m);
    const on=rot.starters.map((id,i)=>{ const m=byId[id]; m.slot=POS[i]; return m; });
    M.teams.push({ tm, side, men, byId, on, rot, tac, order:rot.order,
      home: side===0 && !M.neutral, chemAdj:clamp(tm.chemAdj||0,-.01,.01), injMul:tm.injMul||1, allStar:!!tm.allStar, dirty:true, eff:null, syn:{off:.5,def:.5,reb:.5}, fit:.5,
      st:{pts:0, fast:0, paint:0, second:0, offTov:0, bench:0} });
  });
  return M;
}

function refresh(T){
  // 场上五人的有效合成能力：体能 × 位置适配
  T.eff = T.on.map(m=>{ const f=(0.80+0.20*m.energy)*fitMul(posFit(m.p,m.slot))*m.mul; const c={}; for(const k in m.c) c[k]=(k==='H'?m.c[k]:m.c[k]*f); c.oiqRaw=m.oiq; return c; });
  if(T.dirty){
    const E=T.eff, sig=(x,k,x0)=>1/(1+Math.exp(-k*(x-x0)));
    const n3=E.filter(c=>c.three>=.72).length;
    const off=( 3*sig(n3,3,2) + (Math.max(...E.map(c=>c.handle))>=.75?1:0) + (Math.max(...E.map(c=>c.passing))>=.75?1:0) + (Math.max(...E.map(c=>c.rim))>=.75?1:0) )/6;
    const perim=E.filter(c=>c.perDef>=.72).length;
    const def=( 2*(Math.max(...E.map(c=>c.intDef))>=.75?1:0) + sig(perim,2,1.5)*2 + clamp((E.reduce((s,c)=>s+c.perDef+c.intDef,0)/10-.5)/.2,0,1) )/5;
    const reb=sig(E.filter(c=>Math.max(c.oreb,c.dreb)>=.7).length,2,1.5);
    T.syn={off,def,reb};
    T.fit=systemFit(T.tac.system, E);
    T.dirty=false;
  }
}

function defenderOf(D, offMan, O){
  // 显式重点盯防优先，否则按位置
  const mu=D.tac.matchups||{};
  for(const did in mu){ if(mu[did]===offMan.id){ const d=D.on.find(m=>m.id==did); if(d) return D.on.indexOf(d); } }
  let bi=0, bd=9;
  D.on.forEach((m,i)=>{ const d=Math.abs(POS_I[m.slot]-POS_I[offMan.slot]); if(d<bd){bd=d; bi=i;} });
  return bi;
}

function ev(M, o){ if(M.record){ o.q=M.q; o.clock=Math.round(M.clock*10)/10; o.score=M.score.slice(); M.events.push(o);} }

function addPts(M, side, man, pts){
  M.score[side]+=pts; const T=M.teams[side], D=M.teams[1-side];
  man.pts+=pts; T.st.pts+=pts; if(!man.starter) T.st.bench+=pts;
  T.on.forEach(m=>m.pm+=pts); D.on.forEach(m=>m.pm-=pts);
  if(M.lastScorer===side) M.run[side]+=pts; else { M.run[side]=pts; M.run[1-side]=0; M.lastScorer=side; }
  const diff=M.score[0]-M.score[1], sg=Math.sign(diff);
  if(sg!==0 && M.lead.prevSign!==0 && sg!==M.lead.prevSign) M.lead.changes++;
  if(sg!==0) M.lead.prevSign=sg;
  if(diff>M.lead.max[0]) M.lead.max[0]=diff; if(-diff>M.lead.max[1]) M.lead.max[1]=-diff;
}

function shotXY(rng, type){
  // 半场坐标（英尺）：篮筐在 (0,0)，x 左右 -25..25，y 向中场 0..47
  let r, ang=(rng()*2-1)*Math.PI*.5;
  if(type==='three'){ r=23.9+rng()*4; if(Math.abs(ang)>1.2){ return {x:Math.sign(ang)*(22+rng()*1.5), y:rng()*8}; } }
  else if(type==='mid') r=10+rng()*12;
  else if(type==='post') r=4+rng()*8;
  else r=rng()*4;
  return {x:+clamp(Math.sin(ang)*r,-23.5,23.5).toFixed(1), y:+(Math.max(0,Math.cos(ang)*r)).toFixed(1)};
}

function doFT(M, side, man, n){
  let made=0;
  for(let i=0;i<n;i++){ man.fta++; if(M.rng()<.35+.55*man.c.ft){ man.ftm++; made++; addPts(M,side,man,1);} }
  ev(M,{t:side,type:'ft',pid:man.id,n,made});
  return made;
}

function foulOn(M, D, dIdx, side){
  const dm=D.on[dIdx]; dm.pf++; M.teamFouls[1-side]++;
  if(dm.pf>=6){ dm.out=true; dm.fouledOut=true; ev(M,{t:1-side,type:'foulout',pid:dm.id}); }
  return dm;
}

// 单个回合。返回用掉的秒数
function possession(M){
  const rng=M.rng, side=M.poss, O=M.teams[side], D=M.teams[1-side];
  refresh(O); refresh(D);
  const sys=SYSTEMS[O.tac.system]||SYSTEMS.bal;
  const late = M.q>=4 && M.clock<=60;
  const diffO = M.score[side]-M.score[1-side];
  let dur;
  const paceF = PACE[O.tac.pace]||1;
  const shortStart = M.last==='oreb' || M.last==='nsfoul';
  dur = (shortStart ? 4+rng()*6 : clamp(24*betaLike(rng)*paceF, 4, 24))*P.durK*M.pace;

  // 故意犯规：防守方落后 1–6 分
  if(late && diffO>=1 && diffO<=6 && M.clock>1.5 && M.clock<=(diffO<=3?24:60)){
    const worst=O.on.reduce((a,b)=>a.c.ft<b.c.ft?a:b); const dIdx=Math.floor(rng()*5);
    foulOn(M,D,dIdx,side); ev(M,{t:1-side,type:'ifoul',pid:D.on[dIdx].id,on:worst.id});
    doFT(M,side,worst,2); M.last='made'; return 1+rng()*2.5;
  }
  // 末节领先方拖时间（24 秒内领先，对方来不及了）
  if(M.q>=4 && M.clock<=24 && diffO>0){ M.last='runout'; return M.clock; }
  // 末节最后 2 分钟：落后方抢时间，领先方用满进攻时间
  if(M.q>=4 && M.clock<=120 && !shortStart){
    if(diffO<0 && (-diffO>=4 || (M.clock<=45 && M.clock>24))) dur=Math.min(dur, 4+rng()*5);
    else if(diffO>0) dur=Math.max(dur, 18+rng()*5.5);
  }
  // 每节最后一攻：一定出手，出手时间留 1–4 秒
  if(M.clock<=24 || dur>=M.clock){
    const hurry = M.q>=4 && diffO<=-4;
    if(M.clock<=2.5) dur=M.clock;                                   // 只剩一两秒：直接出手，打完这节
    else if(hurry) dur=Math.min(dur, M.clock-.5);
    else dur=Math.max(.5, M.clock-rng()*2.2);                        // 最后一攻，出手后最多剩 2 秒
  }
  const Eo=O.eff, Ed=D.eff;
  const avg=(E,k)=>E.reduce((s,c)=>s+c[k],0)/E.length;

  // 快攻
  if((M.last==='stl'||M.last==='dreb') && M.lastPoss===side){
    let pf=P.fastBase*(O.tac.pace==='fast'?1.5:O.tac.pace==='slow'?.7:1)*(D.tac.reb==='crash'?1.4:D.tac.reb==='back'?.7:1)
      *(M.last==='stl'?2:1)*Math.pow(avg(Eo,'spd')/C.spd,2)*(D.tac.defense==='press'?1.2:1);
    if(rng()<pf){ const i=O.on.indexOf(pickW(rng,O.on,m=>Math.pow(m.c.spd*m.c.rim,2)*m.energy));
      return shoot(M,O,D,i,'fast',3+rng()*4); }
  }

  // 包夹：挡拆防守选「包夹」，或者指定了重点包夹对象
  M.dblId=null;
  { const dbl=D.tac.double && O.on.find(m=>m.id===D.tac.double);
    if(dbl && rng()<.5) M.dblId=dbl.id;
    else if(D.tac.pnrD==='blitz' && rng()<(O.tac.system==='pnr'?.45:.2)){ const h=O.on.reduce((a,b)=>a.c.handle+a.c.usage>b.c.handle+b.c.usage?a:b); M.dblId=h.id; } }
  // 失误
  const handlers=(Eo.map(c=>(c.handle+c.passing)/2).sort((a,b)=>b-a).slice(0,3).reduce((a,b)=>a+b,0))/3;
  let pTov=P.tovBase*Math.pow(avg(Ed,'steal')/C.steal,.6)*Math.pow(C.hand3/Math.max(.3,handlers),.8)*sys.tov
    *(D.tac.defense==='press'?1.15:1)*(O.tac.pace==='fast'?1.05:1)*(D.tac.defense==='zone131'?1.08:1)
    *(M.dblId?1.2:1)*(D.tac.pnrD==='hedge'&&O.tac.system==='pnr'?1.08:1);
  if(rng()<pTov){
    const i=O.on.indexOf(pickW(rng,O.on,m=>(1.15-m.c.handle)*Math.pow(m.c.usage,3)*(O.tac.stars.includes(m.id)?1.25:1)*(m.id===M.dblId?1.5:1)));
    const tm=O.on[i]; tm.tov++;
    if(rng()<P.stlShare){ const s=pickW(rng,D.on,m=>Math.pow(m.c.steal,2)); s.stl++; M.last='stl'; ev(M,{t:side,type:'stl',pid:tm.id,by:s.id}); }
    else { M.last='tov'; ev(M,{t:side,type:'tov',pid:tm.id}); }
    return M.clock<=2.5? dur : dur*.7;
  }

  // 非投篮犯规
  if(rng()<P.nsFoulBase*(D.tac.defense==='press'?1.45:1)*(D.home?0.97:1)){
    const dIdx=Math.floor(rng()*5); const dm=foulOn(M,D,dIdx,side);
    ev(M,{t:1-side,type:'pf',pid:dm.id});
    if(M.teamFouls[1-side]>=5){ const tgt=pickW(rng,O.on,m=>m.c.usage); doFT(M,side,tgt,2); M.last='ft'; return dur*.5; }
    M.last='nsfoul'; M.keep=true; return dur*.4;
  }

  // 选出手人
  const exp=sys.exp*(P.usageExp/6);
  const tend=(O.rot&&O.rot.tend)||{};
  const i=O.on.indexOf(pickW(rng,O.on,m=>Math.pow(m.c.usage,exp)*(O.tac.stars.includes(m.id)?1.15:1)*(.6+.4*m.energy)*(tend[m.id]||1)*(m.id===M.dblId?.5:1)));
  return shoot(M,O,D,i,null,dur);
}

function betaLike(rng){ // Beta(3,2) 近似：取 5 个均匀数里第 3 小
  const a=[rng(),rng(),rng(),rng()]; a.sort(); return a[2]*.8+.2*rng(); }

function shoot(M,O,D,i,forced,dur){
  const rng=M.rng, side=O.side, sh=O.on[i], c=O.eff[i], sys=SYSTEMS[O.tac.system]||SYSTEMS.bal;
  const Ed=D.eff, dIdx=defenderOf(D,sh,O), dc=Ed[dIdx];
  let type=forced;
  if(!type && M.clock<=2.5 && M.last!=='oreb') type='heave';
  const diffO=M.score[side]-M.score[1-side];
  if(!type){
    if(M.q>=4 && M.clock<=40 && diffO<=-3 && diffO>=-10 && rng()<(diffO===-3?.92:.7)) type='three';
    else {
      const fo=O.tac.focus==='three'?[1.3,.75]:O.tac.focus==='inside'?[.75,1.3]:[1,1];
      const zone=D.tac.defense==='zone23';
      const guardSh = sh.slot==='PG'||sh.slot==='SG';
      const drop = D.tac.pnrD==='drop' && (O.tac.system==='pnr'||guardSh);
      const swH = D.tac.pnrD==='switch' && (sh.slot==='PF'||sh.slot==='C');
      const w={
        three: Math.pow(c.three,2.2)*P.t3*fo[0]*(sys.w.three||1)*(zone?1.15:1)*(drop?1.2:1),
        rim:   Math.pow(c.rim,1.6)*(.6+.4*c.handle)*P.rimW*fo[1]*(sys.w.rim||1)*(drop?.85:1),
        post:  Math.pow(c.post,2)*c.H*.5*P.postW*fo[1]*(sys.w.post||1)*(swH?1.15:1),
        mid:   Math.pow(c.mid,1.8)*P.midW*(sys.w.mid||1)*(drop?1.2:1),
      };
      type=pickW(rng,Object.keys(w),k=>w[k]);
    }
  }
  return takeShot(M,O,D,i,dIdx,type,dur);
}

function takeShot(M,O,D,i,dIdx,type,dur){
  const rng=M.rng, side=O.side, sh=O.on[i], c=O.eff[i], Ed=D.eff, dc=Ed[dIdx];
  const three=type==='three'||type==='heave', pts=three?3:2;
  const maxK=k=>Math.max(...Ed.map(e=>e[k]));
  const avgK=k=>Ed.reduce((s,e)=>s+e[k],0)/Ed.length;
  const off={rim:c.rim,post:c.post,mid:c.mid,three:c.three,putback:c.rim,fast:c.rim,heave:0}[type];
  const def={rim:.5*dc.intDef+.5*maxK('intDef'), post:dc.intDef, mid:dc.perDef, three:.6*dc.perDef+.4*avgK('perDef'), putback:maxK('intDef'), fast:.5, heave:.5}[type];
  // 助攻先抽
  const sys=SYSTEMS[O.tac.system]||SYSTEMS.bal;
  const passAvg=O.eff.reduce((s,e)=>s+e.passing,0)/5;
  const assisted = type!=='putback' && rng() < P.ast[type]*Math.pow(passAvg/C.passing,.7)*sys.ast*(M.dblId && sh.id!==M.dblId?1.15:1);
  const oc={rim:C.rim,post:C.post,mid:C.mid,three:C.three,putback:C.rim,fast:C.rim,heave:0}[type], dcn={rim:C.intDef,post:C.intDef,mid:C.perDef,three:C.perDef,putback:C.intDef,fast:.5,heave:.5}[type];
  let p=P.base[type]+P.kOff[type]*(off-oc)-P.kDef[type]*(def-dcn)
    + (assisted?P.astBonus:0) + P.synK*(O.syn.off-D.syn.def) + P.fitK*(O.fit-.5) + (O.home?P.homeMake:0) + O.chemAdj + (O.allStar?.03:0);
  const df=D.tac.defense;
  if(df==='zone23' && (type==='rim'||type==='post')) p-=.03;
  if(df==='zone23' && three) p+=.01;
  if(df==='zone32' && three) p-=.01;
  if(df==='zone32' && (type==='rim'||type==='post')) p+=.015;
  if(df==='zone131' && three) p+=.015;
  if(df==='zone131' && type==='rim') p+=.015;
  if(D.tac.pnrD==='hedge' && O.tac.system==='pnr' && (sh.slot==='PF'||sh.slot==='C') && type==='rim') p+=.015;
  if(D.tac.pnrD==='switch' && type==='post'){ const dm=D.on[dIdx]; p+=clamp((sh.p.ht-dm.p.ht)/10*.02,-.03,.04); }
  if(M.dblId){ if(sh.id===M.dblId) p-=.02; else if(three) p+=.035; else if(type==='rim') p+=.025; }
  if(D.tac.defense==='press' && (type==='rim'||type==='fast')) p+=.02;
  if(M.toPenalty===side){ p-=.01; }
  { const lead=M.score[side]-M.score[1-side], ex=Math.abs(lead)-P.rubberFrom; if(ex>0) p-=Math.sign(lead)*Math.min(P.rubberCap,ex*P.rubber); }
  p = type==='heave' ? P.base.heave : clamp(p,.05,.95);
  const xy=type==='heave'?{x:+((rng()*2-1)*10).toFixed(1),y:+(30+rng()*15).toFixed(1)}:shotXY(rng,type==='putback'||type==='fast'?'rim':type);
  sh.fga++; if(three) sh.tpa++;
  // 盖帽
  const bMax=maxK('block');
  if(rng()<P.blk[type]*Math.pow(bMax/C.blockMax,1.5)){
    const b=pickW(rng,D.on.map((m,j)=>j),j=>Math.pow(Ed[j].block,4.5)); D.on[b].blk++;
    ev(M,{t:side,type:'blk',pid:sh.id,by:D.on[b].id,shot:type,...xy});
    return rebound(M,O,D,dur,type);
  }
  // 投篮犯规
  const fouled = rng() < P.sFoul[type]*Math.pow(c.drawFoul/C.drawFoul,2)*(D.home?0.97:1);
  const made = rng() < p;
  let fIdx=dIdx; if(fouled && rng()<.3) fIdx=Math.floor(rng()*5);
  if(fouled && !made){
    sh.fga--; if(three) sh.tpa--;   // 被犯规未进不算出手
    const dm=foulOn(M,D,fIdx,side); ev(M,{t:side,type:'sfoul',pid:sh.id,by:dm.id,shot:type,...xy});
    const mk=doFT(M,side,sh,pts);
    if(mk===pts){ M.last='made'; return dur; }
    // 最后一罚不中也可能抢到篮板，简化：按正常篮板
    return rebound(M,O,D,dur*.6,type,true);
  }
  if(made){
    sh.fgm++; if(three) sh.tpm++;
    addPts(M,side,sh,pts);
    if(type==='fast') O.st.fast+=pts; if(type==='rim'||type==='post'||type==='putback'||type==='fast') O.st.paint+=pts;
    if(M.second===side) O.st.second+=pts; if(M.afterTov===side) O.st.offTov+=pts;
    let asst=null;
    if(assisted){ const cand=O.on.filter(m=>m!==sh); asst=pickW(rng,cand,m=>Math.pow(m.c.passing,7)*Math.pow(m.c.usage,2)); asst.ast++; }
    let and1=false;
    if(rng()<P.andOne[type]*Math.pow(c.drawFoul/C.drawFoul,2)){ and1=true; const dm=foulOn(M,D,fIdx,side); ev(M,{t:side,type:'made',pid:sh.id,shot:type,pts,ast:asst&&asst.id,and1:dm.id,...xy}); doFT(M,side,sh,1); }
    else ev(M,{t:side,type:'made',pid:sh.id,shot:type,pts,ast:asst&&asst.id,...xy});
    M.last='made'; return dur;
  }
  ev(M,{t:side,type:'miss',pid:sh.id,shot:type,...xy});
  return rebound(M,O,D,dur,type);
}

function rebound(M,O,D,dur,type,afterFT){
  const rng=M.rng, side=O.side;
  const oSum=O.eff.reduce((s,e)=>s+e.oreb,0), dSum=D.eff.reduce((s,e)=>s+e.dreb,0);
  let p=P.orebBase*Math.pow(oSum/Math.max(.1,dSum)*1.0,1.2)*(O.tac.reb==='crash'?1.12:O.tac.reb==='back'?.88:1)
    *(D.tac.defense==='zone23'?1.03:D.tac.defense==='zone32'?1.05:1)*(0.9+0.2*O.syn.reb)/(0.9+0.2*D.syn.reb);
  if(afterFT) p*=.55;
  p=clamp(p,.05,.6);
  const big=m=>(m.slot==='C'||m.slot==='PF')?1.15:1;
  if(rng()<p){
    const j=O.on.indexOf(pickW(rng,O.on,m=>Math.pow(O.eff[O.on.indexOf(m)].oreb,1.25)*big(m))); const r=O.on[j]; r.oreb++;
    ev(M,{t:side,type:'oreb',pid:r.id});
    if(rng()<P.putbackProb && M.clock-dur>2){ M.second=side; const dIdx=defenderOf(D,r,O); const extra=takeShot(M,O,D,j,dIdx,'putback',1+rng()*2); M.second=null; return dur+extra; }
    M.last='oreb'; M.keep=true; M.second=side; return dur;
  }
  const r=pickW(rng,D.on,m=>Math.pow(D.eff[D.on.indexOf(m)].dreb,1.25)*big(m)); r.dreb++;
  ev(M,{t:1-side,type:'dreb',pid:r.id});
  M.last='dreb'; return dur;
}

// ---------- 换人 ----------
function doSubs(M, side){
  const T=M.teams[side], rng=M.rng;
  const elapsed=((Math.min(M.q,4)-1)*720+(720-M.clock))+(M.q>4?(M.q-4)*300:0);
  const g=clamp(elapsed/2880,0,1);
  const diff=M.score[side]-M.score[1-side];
  const garbage = M.q>=4 && M.clock<300 && Math.abs(diff)>=20;
  const clutch = M.q>=4 && M.clock<300 && Math.abs(diff)<=8;
  const foulLim = M.q===1?2 : M.q===2?3 : M.q===3?4 : 5;
  const bench=()=>T.men.filter(m=>!T.on.includes(m) && !m.out);
  let changed=false;
  const swapIn=(ids)=>{ // 把一组人整组换上，按数组顺序对应 PG..C
    ids.forEach((id,k)=>{ const b=T.byId[id]; if(!b||b.out||T.on.includes(b)) return;
      const slot=POS[k]; let j=T.on.findIndex(m=>m.slot===slot && !ids.includes(m.id)); if(j<0) j=T.on.findIndex(m=>!ids.includes(m.id)); if(j<0) return;
      const m=T.on[j]; b.slot=m.slot; m.slot=null; T.on[j]=b; changed=true; ev(M,{t:side,type:'sub',pin:b.id,pout:m.id}); }); };
  const R=T.rot||{};
  // 关门阵容：第 4 节最后 5 分钟、分差 10 分以内
  if(R.closers && R.closers.length===5 && M.q>=4 && M.clock<300 && Math.abs(diff)<=10 && !T.on.some(m=>m.out)){
    const ok=R.closers.filter(id=>{ const m=T.byId[id]; return m && !m.out && m.pf<6; });
    if(ok.length>=4){ swapIn(R.closers.filter(id=>ok.includes(id))); if(changed){ T.dirty=true; } return; }
  }
  // 小球阵容：第 2、4 节中段各试一次，五人都在板凳上而且体能够
  if(T.tac.smallOn && R.small && R.small.length===5 && (M.q===2||M.q===4) && M.clock<540 && M.clock>200 && !(M.smallUsed||(M.smallUsed={}))[side+'-'+M.q]){
    const ms=R.small.map(id=>T.byId[id]);
    if(ms.every(m=>m && !m.out && m.energy>.85 && m.pf<5) && ms.filter(m=>T.on.includes(m)).length<=2){
      M.smallUsed[side+'-'+M.q]=true; swapIn(R.small); if(changed){ T.dirty=true; ev(M,{t:side,type:'small'}); } return; }
  }
  for(let k=0;k<5;k++){
    const m=T.on[k];
    const behind = m.target*g - m.secs;           // 正数表示欠时间
    let need = m.out
      || (garbage && m.starter)
      || (!clutch && m.pf>=foulLim && M.q<=4)
      || (!clutch && m.energy<P.subEnergy)
      || (clutch && m.energy<.6)
      || (!clutch && !garbage && -behind>90)
      || (m.target===0 && !garbage && !m.out && bench().some(b=>b.target>0));
    if(!need) continue;
    const cands=bench().filter(b=> garbage ? true : (b.target>0 || m.out) );
    if(!cands.length) continue;
    const score=b=>{
      if(garbage) return -b.target + posFit(b.p,m.slot)*10 + b.energy;
      if(clutch) return b.p.ovr*(.8+.2*b.energy) + posFit(b.p,m.slot)*8 - (b.pf>=5?50:0);
      const bb=b.target*g - b.secs;
      return bb/60 + posFit(b.p,m.slot)*6 + b.energy*4 - (b.pf>=foulLim?20:0) - (b.energy<.85?8:0);
    };
    let best=cands[0], bs=-1e9; cands.forEach(b=>{const s=score(b); if(s>bs){bs=s;best=b;}});
    if(!m.out && !garbage && best.energy<.8 && m.energy>=best.energy) continue;
    best.slot=m.slot; m.slot=null; T.on[k]=best; changed=true;
    ev(M,{t:side,type:'sub',pin:best.id,pout:m.id});
  }
  // 欠时间的替补主动上场
  if(!garbage && !clutch){
    for(const b of bench()){
      const bb=b.target*g - b.secs; if(bb<90 || b.energy<.85) continue;
      let worst=-1, ws=-1e9;
      T.on.forEach((m,k)=>{ const sur=m.secs-m.target*g; const s=sur/60 + (1-m.energy)*10 + posFit(b.p,m.slot)*3; if(s>ws){ws=s;worst=k;} });
      if(worst>=0 && ws>2){ const m=T.on[worst]; b.slot=m.slot; m.slot=null; T.on[worst]=b; changed=true; ev(M,{t:side,type:'sub',pin:b.id,pout:m.id}); }
    }
  }
  if(changed) T.dirty=true;
}

// 玩家手动换人：outId 下、inId 上，接替同一个位置
function manualSub(M, side, outId, inId){
  const T=M.teams[side], k=T.on.findIndex(m=>m.id===outId), b=T.byId[inId];
  if(k<0 || !b || T.on.includes(b) || b.out) return false;
  const m=T.on[k]; b.slot=m.slot; m.slot=null; T.on[k]=b; T.dirty=true;
  ev(M,{t:side,type:'sub',pin:b.id,pout:m.id}); return true;
}

function timeout(M, side){
  if(M.timeouts[side]<=0) return false;
  M.timeouts[side]--; M.teams.forEach(T=>T.on.forEach(m=>m.energy=Math.min(1,m.energy+P.toRecover)));
  M.toPenalty=1-side; M.run=[0,0]; ev(M,{t:side,type:'timeout'});
  return true;
}

function endPeriod(M){
  M.qScore[0].push(M.score[0]-M.qScore[0].reduce((a,b)=>a+b,0));
  M.qScore[1].push(M.score[1]-M.qScore[1].reduce((a,b)=>a+b,0));
  ev(M,{type:'eoq'});
  if(M.q>=4 && M.score[0]!==M.score[1]){ M.done=true; return; }
  M.q++; M.clock = M.q>4?300:720; M.teamFouls=[0,0];
  if(M.q>4) M.ot++;
  M.teams.forEach(T=>T.men.forEach(m=>m.energy=Math.min(1,m.energy+(M.q===3?P.qBreak*1.8:P.qBreak))));
  // 每节开始：第 1、3 节球权按跳球，第 2、4 节给另一方
  M.poss = (M.q===2||M.q===3) ? 1-M.first : M.first; if(M.q>4) M.poss = M.rng()<.5?0:1;
  M.last='eoq';
  M.teams.forEach(T=>{ // 第 3 节首发回场
    if(M.q===3) { T.on.forEach(m=>m.slot=null); T.on=T.rot.starters.map((id,i)=>{const m=T.byId[id]; if(m.out) return null; m.slot=POS[i]; return m;});
      const bench=T.men.filter(m=>!T.on.includes(m)&&!m.out).sort((a,b)=>b.p.ovr-a.p.ovr);
      T.on=T.on.map((m,i)=>{ if(m) return m; const b=bench.shift(); b.slot=POS[i]; return b; }); T.dirty=true; }
    doSubs(M,T.side);
  });
}

function step(M){
  if(M.done) return;
  const side=M.poss, O=M.teams[side], D=M.teams[1-side];
  M.keep=false; M.toPenaltyWas=M.toPenalty;
  const prevLast=M.last; M.lastPoss = (prevLast==='stl'||prevLast==='dreb') ? side : -1;
  M.afterTov = (prevLast==='stl'||prevLast==='tov') ? side : null;
  if(prevLast!=='oreb') M.second=null;
  const n0=M.events.length;
  const dur=Math.min(possession(M), M.clock);
  if(M.record){ const cl=Math.round(Math.max(0,M.clock-dur)*10)/10; for(let k=n0;k<M.events.length;k++) M.events[k].clock=cl; }
  if(M.toPenalty===side) M.toPenalty=null;
  // 时间、体能、上场时间
  M.clock-=dur; const u=dur/P.possSec;
  M.teams.forEach(T=>{
    const paceF=(T.tac.pace==='fast'?1.15:T.tac.pace==='slow'?.92:1)*(T.tac.defense==='press'?1.3:T.tac.defense==='zone131'?1.05:1)*((T.tac.pnrD==='blitz'||T.tac.double)?1.12:T.tac.pnrD==='hedge'?1.04:1);
    T.men.forEach(m=>{
      if(T.on.includes(m)){ m.secs+=dur; m.energy=Math.max(.2,m.energy-P.drain*u*paceF*(1.35-m.c.sta)); }
      else m.energy=Math.min(1,m.energy+P.recover*u);
    });
    // 场内伤病
    T.on.forEach(m=>{ if(!m.out && M.rng()<P.injury*u*(1.6-m.p.dur/100)*T.injMul*(T.allStar?.2:1)){ m.out=true; m.inj=true; ev(M,{t:T.side,type:'injury',pid:m.id}); } });
  });
  // 球权
  if(!M.keep) M.poss=1-side;
  // 死球：换人和暂停
  const dead = !['stl','dreb'].includes(M.last);
  if(M.clock<=0.05){ endPeriod(M); return; }
  if(dead || M.teams.some(T=>T.on.some(m=>m.out))){
    [0,1].forEach(s=>{
      // AI 暂停：对方连续得分 ≥ 8
      if(M.run[1-s]>=8 && (s!==M.userSide || M.autoTimeout) && M.timeouts[s]>0 && M.rng()<.6) timeout(M,s);
      if(s!==M.userSide || M.autoSubs!==false) doSubs(M,s);
      else if(M.teams[s].on.some(m=>m.out)) doSubs(M,s);   // 玩家一方只在有人伤退/罚下时强制补人
    });
  }
}

function run(M){ let g=0; while(!M.done && g++<2000) step(M); return M; }

function gameScore(m){ return m.pts+.4*m.fgm-.7*m.fga-.4*(m.fta-m.ftm)+.7*m.oreb+.3*m.dreb+m.stl+.7*m.ast+.7*m.blk-.4*m.pf-m.tov; }

function boxScore(M){
  return M.teams.map(T=>({
    side:T.side, pts:M.score[T.side], q:M.qScore[T.side], st:T.st, fit:T.fit, system:T.tac.system,
    players:T.men.filter(m=>m.secs>0||m.inj).map(m=>({id:m.id, min:m.secs/60, pts:m.pts, fgm:m.fgm, fga:m.fga, tpm:m.tpm, tpa:m.tpa,
      ftm:m.ftm, fta:m.fta, oreb:m.oreb, dreb:m.dreb, ast:m.ast, stl:m.stl, blk:m.blk, tov:m.tov, pf:m.pf, pm:m.pm,
      starter:m.starter, inj:m.inj, gs:gameScore(m), energy:m.energy})),
  }));
}

const API={P, POS, setCenters, setC(o){ C=o; }, get C(){return C;}, SYSTEMS, composite, posFit, ovrOf, autoRotation, autoTactics, systemFit, createMatch, step, run, timeout, manualSub, doSubs, boxScore, gameScore, mulberry32};
if(typeof module!=='undefined' && module.exports) module.exports=API; else root.BBEngine=API;
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
"use strict";
const E = BBEngine;
const KEYS = ATTR_DEF.map(x=>x[0]), ATTR_CN = Object.fromEntries(ATTR_DEF);
const ATTR_GROUPS = [['进攻',['finish','dunk','mid','three','ft','handle','pass','post']],['防守',['perD','intD','stl','blk','oreb','dreb']],['身体',['spd','jmp','str','sta']],['意识',['oiq','diq','hustle']]];
const POS = E.POS, POS_CN = {PG:'控卫',SG:'分卫',SF:'小前',PF:'大前',C:'中锋'};
const SYS_DESC = {bal:'不偏重任何打法', pnr:'持球人和大个子挡拆，顺下或者分球', iso:'球交给最强的人一对一', post:'内线要位单打，外线等分球', motion:'无球跑动、空切、手递手', spread:'五人拉开，突破分球投三分'};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const sn = p=>p.cn.includes('·')?p.cn.split('·').pop():p.cn;

// ---------- 数据 ----------
// W：联盟层面的状态（年份、选秀权、死钱、选秀、休赛期进度），和球员一起存进「联盟存档」
let PID=1;
let W={year:2026, picks:{}, dead:{}, off:null, centers:null, draftClass:[], mle:{}};
const TEAMS = TEAM_DATA.map((t,i)=>{
  const [abbr,enCity,enName,city,nick,conf,div,pop,colors]=t;
  const players = REAL_ROSTERS[abbr].map(r=>makePlayer(r));
  return {i, abbr, city, nick, cn:city+nick, conf, div, pop, colors, players};
});
const FREE = REAL_ROSTERS.FA.map(r=>makePlayer(r));
function birthYM(p){ const [by,bm]=p.born.split('-').map(Number); return [by,bm]; }
function ageOf(p, year){ const [by,bm]=birthYM(p); return (year||W.year)-by-(bm>10?1:0); }
function makePlayer(r){
  const [en,cn,pos,pos2,born,ht,ws,wt,nat,pot,dur,prof,a,c,jersey]=r;
  const A={}; KEYS.forEach((k,i)=>A[k]=a[i]);

      ${Lu?`<table><tbody>${POS.map((ps,i)=>{ const p=P(Lu[i]), f=E.posFit(p,ps); return `<tr><td><b>${ps}</b> <span class="hint">${POS_CN[ps]}</span></td><td><select data-lu="${key}" data-i="${i}">${optList(Lu[i],ps)}</select></td><td class="n">${ovrTag(p.ovr)}</td><td class="n ${f<1?(f<.8?'bad':'warn'):''}">${Math.round(f*100)}%</td></tr>`; }).join('')}</tbody></table>`:''}
      <div style="margin-top:8px">${Lu?`<button class="sm" data-luclear="${key}">取消这套阵容</button>`:`<button class="sm" data-luset="${key}">设置这套阵容（先用首发填上）</button>`}</div></div>`; };
  v.innerHTML=`<h1>轮换</h1><div class="sub">首发五人、替补顺序、每人目标上场时间。比赛里系统按这张表换人，体能太低、犯规太多时会提前换下。有人受伤时，系统会临时找人顶替首发，并把他的时间分给其他人。</div>
   <div class="card"><h3>上场时间合计 <span class="r" style="color:var(${total===240?'--good':'--bad'})"><b>${total}</b> / 240 分钟${total===240?'':'，开赛前需要调整到 240'}</span></h3>
     <button class="sm" id="rot-reset">按建议值重置</button></div>
   <div class="card tw"><h3>首发</h3><table><thead><tr><th>位置</th><th>球员</th><th class="n">总评</th><th class="n">适配</th><th class="n">目标分钟</th><th>出手</th></tr></thead><tbody>
   ${R.starters.map((id,i)=>{ const p=P(id), f=E.posFit(p,POS[i]); return `<tr><td><b>${POS[i]}</b> <span class="hint">${POS_CN[POS[i]]}</span></td>
     <td><select data-st="${i}">${optList(id,POS[i])}</select></td><td class="n">${ovrTag(p.ovr)}</td>
     <td class="n ${f<1?(f<.8?'bad':'warn'):''}">${Math.round(f*100)}%</td><td class="n">${minInput(id)}</td><td>${tendSel(id)}</td></tr>`; }).join('')}
   </tbody></table></div>
   <div class="card tw"><h3>替补（按上场顺序）</h3><table><thead><tr><th>#</th><th>球员</th><th>位置</th><th class="n">总评</th><th class="n">目标分钟</th><th>出手</th><th></th></tr></thead><tbody>
   ${bench.map((id,i)=>{ const p=P(id); return `<tr><td>${i+6}</td><td class="cl" data-id="${id}"><b>${esc(p.cn)}</b>${injTag(p)}</td><td>${p.pos}${p.pos2.length?'/'+p.pos2.join('/'):''}</td>
     <td class="n">${ovrTag(p.ovr)}</td><td class="n">${minInput(id)}</td><td>${tendSel(id)}</td>
     <td><button class="sm" data-up="${i}" ${i===0?'disabled':''}>上移</button> <button class="sm" data-dn="${i}" ${i===bench.length-1?'disabled':''}>下移</button></td></tr>`; }).join('')}
   </tbody></table></div>
   ${lineupCard('closers','关门阵容','第 4 节最后 5 分钟、分差 10 分以内时整组换上')}${lineupCard('small','小球阵容','在战术页打开以后，第 2、4 节中段整组换上一次')}`;
  v.querySelector('#rot-reset').onclick=()=>{ G.rot=E.autoRotation(t); save(); vRot(v); };
  v.querySelectorAll('select[data-st]').forEach(s=>s.onchange=()=>{ const i=+s.dataset.st, nid=+s.value, old=R.starters[i];
    const j=R.starters.indexOf(nid); if(j>=0) R.starters[j]=old;         // 已在首发：两人换位
    R.starters[i]=nid; R.order=[...R.order.filter(x=>x!==nid && !R.starters.includes(x)), ...(j<0?[old]:[])].filter(x=>!R.starters.includes(x));
    t.players.forEach(p=>{ if(!R.starters.includes(p.id) && !R.order.includes(p.id)) R.order.push(p.id); });
    save(); vRot(v); });
  v.querySelectorAll('input[data-min]').forEach(inp=>inp.onchange=()=>{ R.minutes[inp.dataset.min]=clamp(Math.round(+inp.value||0),0,48); save(); vRot(v); });
  const mv=(i,d)=>{ const b=R.order.filter(id=>!R.starters.includes(id)); [b[i],b[i+d]]=[b[i+d],b[i]]; R.order=b; save(); vRot(v); };
  v.querySelectorAll('button[data-up]').forEach(b=>b.onclick=()=>mv(+b.dataset.up,-1));
  v.querySelectorAll('button[data-dn]').forEach(b=>b.onclick=()=>mv(+b.dataset.dn,1));
  v.querySelectorAll('td[data-id]').forEach(td=>td.onclick=()=>showPlayer(PBYID[td.dataset.id]));
  v.querySelectorAll('select[data-tend]').forEach(s=>s.onchange=()=>{ const x=+s.value; if(x===1) delete R.tend[s.dataset.tend]; else R.tend[s.dataset.tend]=x; save(); });
  v.querySelectorAll('[data-luset]').forEach(b=>b.onclick=()=>{ R[b.dataset.luset]=R.starters.slice(); save(); vRot(v); });
  v.querySelectorAll('[data-luclear]').forEach(b=>b.onclick=()=>{ R[b.dataset.luclear]=null; if(b.dataset.luclear==='small') G.tac.smallOn=false; save(); vRot(v); });
  v.querySelectorAll('select[data-lu]').forEach(s=>s.onchange=()=>{ const Lu=R[s.dataset.lu], i=+s.dataset.i, nid=+s.value, j=Lu.indexOf(nid); if(j>=0) Lu[j]=Lu[i]; Lu[i]=nid; save(); vRot(v); });
}

// ---------- 战术 ----------
function compsOf(ids){ return ids.map(id=>{ const p=PBYID[id]; return Object.assign(E.composite(p),{oiqRaw:p.a.oiq/100}); }); }
const DEF_DESC={man:'每人盯一个，按位置对位或者按重点盯防', zone23:'护内线：对方篮下命中下降，但三分出手变多，后场篮板略差', zone32:'护外线：对方三分命中下降，但篮下更容易，前场篮板也更容易被抢', zone131:'逼抢传球路线：对方失误增加，但底角三分和篮下有漏洞，体能消耗略大', press:'全场上抢：对方失误增加，但自己犯规多、体能消耗大，被打穿就是轻松上篮'};
const PNR_DESC={std:'不做特殊处理', drop:'大个子退守篮下：对方持球人更多投中投和三分，突破变少', hedge:'大个子上提：对方挡拆失误增加，但顺下的人更容易得手，大个子更累', switch:'直接换人：对方会找错位，身高差越大，背身越占便宜', blitz:'两人夹击持球人：对方失误增加、核心出手减少，但空位三分和篮下 4 打 3 会变多，自己更累'};
function tacticsHTML(tac, starters, smallRow){
  const comps=compsOf(starters);
  const seg=(key,opts)=>`<div class="seg">${opts.map(([k,n])=>`<button class="${(key==='smallOn'?(tac.smallOn?'on':'off'):tac[key])===k?'on':''}" data-tk="${key}" data-tv="${k}">${n}</button>`).join('')}</div>`;
  return `<div class="card"><h3>进攻体系 <span class="r">契合度按当前首发五人计算</span></h3><div class="sysgrid">
    ${Object.entries(E.SYSTEMS).map(([k,s])=>{ const f=E.systemFit(k,comps); return `<div class="syscard ${tac.system===k?'on':''}" data-sys="${k}"><b>${s.name}</b>
      <div class="fitbar" style="margin-top:4px">${bar(f,1,f>=.6?'#00c276':f>=.4?'#f0a020':'#e5484d')}<span class="hint">${k==='bal'?'—':Math.round(f*100)+'%'}</span></div><p>${SYS_DESC[k]}</p></div>`; }).join('')}
    </div></div>
    <div class="card"><div style="display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center">
      <span>节奏</span>${seg('pace',[['slow','慢'],['mid','中'],['fast','快']])}
      <span>进攻重心</span>${seg('focus',[['three','三分'],['bal','均衡'],['inside','内线']])}
      <span>防守方式</span>${seg('defense',[['man','人盯人'],['zone23','2-3 联防'],['zone32','3-2 联防'],['zone131','1-3-1 联防'],['press','全场紧逼']])}
      <span></span><span class="hint">${DEF_DESC[tac.defense]||''}</span>
      <span>挡拆防守</span>${seg('pnrD',[['std','标准'],['drop','沉退'],['hedge','上提'],['switch','换防'],['blitz','包夹']])}
      <span></span><span class="hint">${PNR_DESC[tac.pnrD||'std']}</span>
      <span>篮板策略</span>${seg('reb',[['crash','冲抢前场'],['bal','均衡'],['back','退防']])}
      ${smallRow?`<span>小球阵容</span>${seg('smallOn',[['off','不用'],['on','第 2、4 节中段换上']])}`:''}
    </div></div>`;
}
function bindTactics(root, tac, onChange){
  root.querySelectorAll('[data-tk]').forEach(b=>b.onclick=()=>{ const k=b.dataset.tk; tac[k]= k==='smallOn'? b.dataset.tv==='on' : b.dataset.tv; onChange(); });
  root.querySelectorAll('[data-sys]').forEach(b=>b.onclick=()=>{ tac.system=b.dataset.sys; onChange(); });
}
function vTac(v){
  const t=myTeam(), tac=G.tac;
  const rotIds=[...G.rot.starters, ...G.rot.order].filter(id=>(G.rot.minutes[id]||0)>0);
  v.innerHTML=`<h1>战术</h1><div class="sub">比赛中暂停时也可以随时改</div>${tacticsHTML(tac,G.rot.starters,!!G.rot.small)}
    <div class="card"><h3>核心球员 <span class="r">最多 2 人，出手机会增加</span></h3><div class="row">
    ${rotIds.map(id=>{ const p=PBYID[id]; return `<button class="sm ${tac.stars.includes(id)?'on':''}" data-star="${id}">${esc(p.cn)} ${p.ovr}</button>`; }).join('')}</div></div>`;
  const ug=nextUserGame();
  if(ug){ const o=TEAMS[ug.opp]; v.insertAdjacentHTML('beforeend',`<div class="card tw"><h3>重点盯防：下一场对手 ${logo(o,18)} ${esc(o.cn)} <span class="r">只对下一场有效，不设就按位置对位</span></h3><table><tbody>
    ${G.rot.starters.map((id,i)=>{ const p=PBYID[id]; return `<tr><td>${POS_CN[POS[i]]} <b>${esc(p.cn)}</b></td><td><select data-mu="${id}"><option value="">按位置</option>${o.players.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,10).map(q=>`<option value="${q.id}" ${PREP.mu[id]==q.id?'selected':''}>${esc(q.cn)} ${q.pos} ${q.ovr}</option>`).join('')}</select></td></tr>`; }).join('')}</tbody></table></div>`);
    v.insertAdjacentHTML('beforeend',`<div class="card"><h3>重点包夹 <span class="r">只对下一场有效。对方这名球员持球时有一半机会被夹击</span></h3><select id="dbl"><option value="">不包夹</option>${o.players.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,8).map(q=>`<option value="${q.id}" ${PREP.dbl==q.id&&PREP.muFor===ug.key?'selected':''}>${esc(q.cn)} ${q.pos} ${q.ovr}</option>`).join('')}</select></div>`);
    if(PREP.muFor!==ug.key){ PREP.mu={}; PREP.dbl=null; PREP.muFor=ug.key; }
    v.querySelector('#dbl').onchange=e=>{ PREP.dbl=e.target.value?+e.target.value:null; };
    v.querySelectorAll('[data-mu]').forEach(s=>s.onchange=()=>{ if(s.value) PREP.mu[s.dataset.mu]=+s.value; else delete PREP.mu[s.dataset.mu]; }); }
  bindTactics(v, tac, ()=>{ save(); vTac(v); });
  v.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{ const id=+b.dataset.star; const i=tac.stars.indexOf(id);
    if(i>=0) tac.stars.splice(i,1); else { tac.stars.push(id); if(tac.stars.length>2) tac.stars.shift(); } save(); vTac(v); });
}

// ---------- 比赛 ----------
let LIVE=null, PREP={mu:{}, muFor:null};
function startLive(){
  const S=G.season, ug=userGameToday(); if(!ug || LIVE) return;
  const h=ug.g?ug.g[1]:ug.h, a=ug.g?ug.g[2]:ug.a;
  applyPlayerState();
  const hs=sideFor(h), as=sideFor(a);
  const mine = h===G.team? hs : as; mine.tactics.matchups = PREP.muFor===ugKey(ug)? Object.assign({},PREP.mu) : {}; mine.tactics.double = PREP.muFor===ugKey(ug)? PREP.dbl : null;
  const M=E.createMatch(hs, as, {record:true});
  M.userSide = h===G.team?0:1;
  LIVE={M, H:TEAMS[h], A:TEAMS[a], shown:0, playing:false, speed:1, acc:0, last:0, raf:0, tab:'pbp', dots:[], finished:false, label:ug.label||'常规赛', showNames:true};
  LIVE.frame=tipFrame(M); LIVE.pos=Object.assign({},LIVE.frame.pos); LIVE.ball=LIVE.frame.ball.slice(); LIVE.holder=null;
  G.view='match'; render(); setTimeout(()=>playLive(true),300);
}
function ugKey(ug){ return ug.g? 'r'+ug.n : ug.key; }
function quickUserGame(){ if(LIVE) return; playDay(null); afterDay(); }
function stopLive(){ if(LIVE){ cancelAnimationFrame(LIVE.raf); LIVE.playing=false; } }
function pauseLive(){ if(LIVE){ if(LIVE.playing && LIVE.scene) LIVE.pausedAt=performance.now()-LIVE.sceneStart; LIVE.playing=false; cancelAnimationFrame(LIVE.raf); updCtrl(); } }
function playLive(on){
  if(!LIVE || LIVE.M.done) return;
  LIVE.playing=on; updCtrl();
  if(on){ const now=performance.now(); LIVE.last=now; LIVE.acc=0; if(LIVE.scene && LIVE.pausedAt!=null){ LIVE.sceneStart=now-LIVE.pausedAt; } LIVE.pausedAt=null; LIVE.raf=requestAnimationFrame(tick); } else { if(LIVE.scene) LIVE.pausedAt=performance.now()-LIVE.sceneStart; cancelAnimationFrame(LIVE.raf); }
}
function finishLive(){
  const L=LIVE; if(L.finished) return; L.finished=true; L.playing=false;
  playDay(L.M);                       // 结果落地，并把当天其他比赛跑完
  L.tab='box'; render();
}

function nameOf(id){ const p=PBYID[id]; return p?sn(p):'?'; }
function teamOf(side){ return side===0?LIVE.H:LIVE.A; }
function clockTxt(q,c){ const m=Math.floor(c/60), s=Math.floor(c%60); return `${q<=4?'第'+q+'节':'加时'+(q-4)} ${m}:${String(s).padStart(2,'0')}`; }
const pick=a=>a[Math.floor(Math.random()*a.length)];
function pbpText(e){
  const n=nameOf(e.pid);
  switch(e.type){
    case 'made': { let s;
      if(e.shot==='three') s=pick([`${n} 三分出手，进了。`,`${n} 弧顶三分，命中。`,`${n} 底角三分，稳稳进了。`,`${n} 接球就投，三分命中。`]);
      else if(e.shot==='mid') s=pick([`${n} 中距离急停跳投，进。`,`${n} 罚球线附近干拔，命中。`,`${n} 侧翼跳投，进了。`]);
      else if(e.shot==='post') s=pick([`${n} 低位背身，转身勾手打进。`,`${n} 背打单吃，翻身跳投命中。`,`${n} 内线要位，一个假动作后打进。`]);
      else if(e.shot==='putback') s=pick([`${n} 补篮得手。`,`${n} 在人堆里把球补了进去。`]);
      else if(e.shot==='fast') s=pick([`${n} 快攻上篮。`,`${n} 一条龙推到底，轻松得分。`,`${n} 反击，没人追得上。`]);
      else if(e.shot==='heave') s=`${n} 超远距离硬扔……进了！`;
      else { const p=PBYID[e.pid]; s = p && p.a.dunk>=80 && Math.random()<.5 ? pick([`${n} 突破到篮下，扣了。`,`${n} 空中接力暴扣。`]) : pick([`${n} 突破上篮得手。`,`${n} 杀进内线，打进。`,`${n} 篮下拿下两分。`]); }
      if(e.ast) s+=`（${nameOf(e.ast)} 助攻）`;
      if(e.and1) s+=` ${nameOf(e.and1)} 犯规，加罚一次。`;
      return s; }
    case 'miss': return e.shot==='three'?pick([`${n} 三分不中。`,`${n} 三分出手，弹框而出。`,`${n} 外线投射偏了。`])
      : e.shot==='mid'?pick([`${n} 中投没进。`,`${n} 跳投偏出。`]) : e.shot==='post'?pick([`${n} 背身出手，没进。`,`${n} 勾手打铁。`])
      : e.shot==='heave'?`${n} 压哨远投，没进。` : pick([`${n} 上篮没进。`,`${n} 篮下出手滑框。`]);
    case 'blk': return pick([`${nameOf(e.by)} 把 ${n} 的出手盖了。`,`${n} 出手被 ${nameOf(e.by)} 封盖。`,`${nameOf(e.by)} 一记大帽，${n} 没打成。`]);
    case 'sfoul': return `${n} 出手时被 ${nameOf(e.by)} 犯规。`;
    case 'ft': return `${n} 罚球 ${e.n} 中 ${e.made}。`;
    case 'oreb': return pick([`${n} 抢到前场篮板。`,`${n} 冲进去拿下进攻篮板。`]);
    case 'dreb': return `${n} 后场篮板。`;
    case 'stl': return pick([`${nameOf(e.by)} 抢断 ${n}。`,`${n} 的球被 ${nameOf(e.by)} 掏走了。`,`${nameOf(e.by)} 读到传球路线，断了。`]);
    case 'tov': return pick([`${n} 失误。`,`${n} 传球出界。`,`${n} 走步。`,`${n} 进攻犯规。`]);
    case 'pf': return `${n} 犯规。`;
    case 'ifoul': return `${n} 故意犯规，把 ${nameOf(e.on)} 送上罚球线。`;
    case 'sub': return `换人：${nameOf(e.pin)} 替下 ${nameOf(e.pout)}。`;
    case 'timeout': return `${teamOf(e.t).cn} 叫了暂停。`;
    case 'small': return `${teamOf(e.t).nick} 换上小球阵容。`;
    case 'injury': return `${n} 受伤倒地，被扶下场。`;
    case 'foulout': return `${n} 六次犯规，被罚出场。`;
    default: return '';
  }
}

function updCtrl(){
  const c=document.getElementById('ctrl'); if(!c||!LIVE) return; const L=LIVE, M=L.M, us=M.userSide;
  if(L.finished){ const w=M.score[us]>M.score[1-us];
    c.innerHTML=`<b class="${w?'good':'bad'}" style="font-size:15px">${w?'赢了':'输了'} ${M.score[us]} : ${M.score[1-us]}${M.ot?'（'+M.ot+' 个加时）':''}</b>
      <button class="pri" id="back">返回首页</button>`;
    c.querySelector('#back').onclick=()=>{ LIVE=null; G.view='home'; render(); };
    return; }
  c.innerHTML=`<button class="pri" id="pp" style="min-width:80px">${L.playing?'暂停':'继续'}</button>
    <div class="seg">${[1,2,4,8].map(s=>`<button class="${L.speed===s?'on':''}" data-sp="${s}">${s}x</button>`).join('')}</div>
    <button id="end">直接出结果</button>
    <button id="to" ${M.timeouts[us]<=0?'disabled':''}>叫暂停（${M.timeouts[us]}）</button>
    <button id="subs">换人</button><button id="tacb">战术</button><button id="names" class="${L.showNames?'on':''}">名字</button>`;
  c.querySelector('#pp').onclick=()=>playLive(!L.playing);
  c.querySelector('#names').onclick=()=>{ L.showNames=!L.showNames; updCtrl(); drawCourt(); };
  c.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{ L.speed=+b.dataset.sp; updCtrl(); });
  c.querySelector('#end').onclick=simToEnd;
  c.querySelector('#to').onclick=()=>{ if(E.timeout(M,us)){ updLive(); pauseLive(); } };
  c.querySelector('#subs').onclick=()=>{ pauseLive(); subsModal(); };

// ================= 赛季系统 =================
// 规范：《第二阶段规范.md》§1–2
let SEASON_START = new Date(2026, 9, 20);        // 每年 10 月 20 日开幕
const REG_DAYS = 174;                             // 到次年 4 月 11 日左右
let ASB = [dayOf(new Date(2027,1,13)), dayOf(new Date(2027,1,18))];   // 全明星假期
let CUP_DAYS=[];                                  // NBA 杯淘汰赛：1/4 决赛两天、半决赛、决赛
function setSeasonYear(y){ SEASON_START=new Date(y,9,20); ASB=[dayOf(new Date(y+1,1,13)), dayOf(new Date(y+1,1,18))]; CUP_DAYS=[9,10,13,16].map(d=>dayOf(new Date(y,11,d))); }
function dayOf(dt){ return Math.round((dt - SEASON_START)/86400000); }
function dateOf(d){ const x=new Date(SEASON_START); x.setDate(x.getDate()+d); return x; }
const WEEK='日一二三四五六';
function dateTxt(d, withWeek){ const x=dateOf(d); return `${x.getMonth()+1}月${x.getDate()}日${withWeek?' 周'+WEEK[x.getDay()]:''}`; }

function srand(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------- 赛程 ----------
function genSchedule(seed, cupPairs){
  const rng=srand(seed), pairs=[];            // [home, away]
  const cupWin=[dayOf(new Date(SEASON_START.getFullYear(),10,1)), CUP_DAYS[0]-6], cupIdx=new Set();
  const conf=t=>TEAMS[t].conf, div=t=>TEAMS[t].div;
  const add=(a,b,n,homeA)=>{ for(let k=0;k<n;k++){ if(k===0 && cupPairs && cupPairs.has(Math.min(a,b)+'-'+Math.max(a,b))) cupIdx.add(pairs.length); pairs.push(k<homeA?[a,b]:[b,a]); } };
  for(let a=0;a<30;a++) for(let b=a+1;b<30;b++){
    if(conf(a)!==conf(b)) add(a,b,2,1);
    else if(div(a)===div(b)) add(a,b,4,2);
  }
  // 同分区不同赛区：5×5 循环，(j−i) mod 5 ∈ {0,1,2} 打 4 场，否则 3 场
  ['东','西'].forEach(cf=>{
    const divs=[...new Set(TEAMS.filter(t=>t.conf===cf).map(t=>t.div))];
    for(let x=0;x<3;x++) for(let y=x+1;y<3;y++){
      const A=TEAMS.filter(t=>t.div===divs[x]).map(t=>t.i), B=TEAMS.filter(t=>t.div===divs[y]).map(t=>t.i);
      A.forEach((a,i)=>B.forEach((b,j)=>{ const four=((j-i+5)%5)<3; add(a,b,four?4:3, four?2:((i+j)%2?2:1)); }));
    }
  });
  // 排日期：逐日贪心，优先排剩余场次多、剩余天数少的队
  const left=pairs.map((p,i)=>i); const games=[]; const last=new Array(30).fill(-9), last2=new Array(30).fill(-9), rem=new Array(30).fill(0);
  pairs.forEach(([h,a])=>{rem[h]++;rem[a]++;});
  for(let i=left.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [left[i],left[j]]=[left[j],left[i]]; }
  let d=0;
  while(left.length && d<REG_DAYS+30){
    if((d>=ASB[0] && d<=ASB[1]) || CUP_DAYS.includes(d)){ d++; continue; }
    const daysLeft=Math.max(1, REG_DAYS - d - (d<ASB[0]?6:0) - CUP_DAYS.filter(x=>x>=d).length);
    const busy=new Set(); const need=t=>rem[t]/daysLeft;
    const inWin=d>=cupWin[0]&&d<=cupWin[1];
    const cand=left.filter(i=>!cupIdx.has(i)||d>=cupWin[0]).map(i=>{ const [h,a]=pairs[i]; return {i,h,a,s:need(h)+need(a)+rng()*.05+(inWin&&cupIdx.has(i)?2:0)}; }).sort((x,y)=>y.s-x.s);
    const target = Math.min(15, Math.round(left.length/Math.max(1,daysLeft-0.5)*(0.9+rng()*.35)));
    let n=0;
    for(const c of cand){
      if(n>=target) break;
      if(busy.has(c.h)||busy.has(c.a)) continue;
      const tired=t=>last[t]===d-1 && last2[t]===d-2;       // 不排三连
      if(tired(c.h)||tired(c.a)) continue;
      const b2b=(last[c.h]===d-1)+(last[c.a]===d-1);
      if(b2b && c.s<2*2*82/168*1.05 && rng()<.85) continue;  // 背靠背尽量少
      busy.add(c.h); busy.add(c.a); n++;
      games.push(cupIdx.has(c.i)?[d,c.h,c.a,null,null,0,'cup']:[d,c.h,c.a,null,null,0]);
      [c.h,c.a].forEach(t=>{ last2[t]=last[t]; last[t]=d; rem[t]--; });
      left.splice(left.indexOf(c.i),1);
    }
    d++;
  }
  games.sort((x,y)=>x[0]-y[0]);
  return games;
}

const INJ_TABLE=[ [.55,1,3,['脚踝扭伤','手指挫伤','背部痉挛','膝盖挫伤','臀部挫伤']], [.25,7,14,['腘绳肌拉伤','小腿拉伤','脚踝扭伤','腹股沟拉伤']],
  [.14,21,42,['膝盖扭伤','肩部拉伤','足底筋膜炎','手腕骨裂']], [.05,60,120,['半月板撕裂','脚部骨折']], [.01,400,400,['跟腱断裂','前十字韧带撕裂']] ];
function rollInjury(p, rng){
  let r=rng()*(0.85+0.3*(1-p.dur/100)*2), acc=0;         // 耐久越低，越往重的方向偏
  r = Math.min(r, .9999);
  for(const [pr,a,b,names] of INJ_TABLE){ acc+=pr; if(r<acc || pr===.01){ const days=Math.round(a+(b-a)*rng()); return {days, name:names[Math.floor(rng()*names.length)]}; } }
}

// ---------- 轮换（考虑伤病） ----------
function effectiveRotation(t, rot){
  const avail=p=>!(p.injury>0);
  const R=JSON.parse(JSON.stringify(rot));
  const byId=id=>PBYID[id];
  R.starters=R.starters.map((id,i)=>{
    if(avail(byId(id))) return id;
    const cand=[...R.order, ...t.players.map(p=>p.id)].filter((x,k,a)=>a.indexOf(x)===k && !R.starters.includes(x) && avail(byId(x)));
    let best=null,bs=-1e9; cand.forEach(x=>{ const p=byId(x); const s=p.ovr-(1-E.posFit(p,POS[i]))*22; if(s>bs){bs=s;best=x;} });
    if(best!=null){ R.minutes[best]=Math.max(R.minutes[best]||0, R.minutes[id]||0); R.minutes[id]=0; R.order=R.order.filter(x=>x!==best); R.order.push(id); }
    return best!=null?best:id;
  });
  t.players.forEach(p=>{ if(!avail(p)) R.minutes[p.id]=0; });
  // 合计补回 240：按原有分钟比例分给健康球员，单人最多 42
  let tot=Object.values(R.minutes).reduce((a,b)=>a+b,0);
  const pool=t.players.filter(p=>avail(p) && (R.minutes[p.id]||0)>0);
  let guard=0;
  while(tot!==240 && pool.length && guard++<500){
    const d=tot<240?1:-1; const p=pool[guard%pool.length];
    const m=R.minutes[p.id]; if(d>0 && m>=42) continue; if(d<0 && m<=0) continue;
    R.minutes[p.id]=m+d; tot+=d;
  }
  return R;
}
function aiSide(t){ const key=t.players.filter(p=>p.injury>0).map(p=>p.id).join(',');
  if(t._rkey!==key || !t._rot){ t._rkey=key; t._rot=E.autoRotation(t); t._tac=E.autoTactics(t,t._rot); } return {players:t.players, rotation:t._rot, tactics:Object.assign({},t._tac,{matchups:{}})}; }
function userSide(){ const t=myTeam(); return {players:t.players, rotation:effectiveRotation(t,G.rot), tactics:Object.assign(JSON.parse(JSON.stringify(G.tac)),{matchups:{}})}; }
function sideFor(ti){ return Object.assign(ti===G.team? userSide() : aiSide(TEAMS[ti]), lifeSide(ti)); }

// ---------- 一场比赛的结果落地 ----------
const PS_KEYS=['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','ast','stl','blk','tov','pf','pm'];
function recordGame(M, hIdx, aIdx, gameRef, playoff){
  const S=G.season, rng=srand((S.seed^(gameRef.n*7919))>>>0);
  const store = playoff==='cup'? {} : playoff? S.pps : S.ps;
  M.teams.forEach((T,side)=>{
    T.men.forEach(m=>{
      const p=m.p; if(m.secs<=0 && !m.inj) return;
      const q=store[p.id]||(store[p.id]={g:0,gs:0,min:0,pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,tov:0,pf:0,pm:0,team:side===0?hIdx:aIdx});
      q.team = side===0?hIdx:aIdx;
      if(m.secs>0){ q.g++; if(m.starter) q.gs++; q.min+=m.secs/60; PS_KEYS.slice(1).forEach(k=>q[k]+=m[k]); }
      S.cond[p.id] = clamp((S.cond[p.id]==null?100:S.cond[p.id]) - m.secs/60*1.2, 20, 100);
      if(m.inj){ const r=rollInjury(p,rng); if(r.days<400) r.days=Math.max(1,Math.round(r.days*injDaysMul(q.team))); S.inj[p.id]=r; p.injury=r.days;
        if(q.team===G.team) S.inbox.push({d:S.day, t:`${p.cn} 受伤`, b:`${r.name}，预计缺阵 ${r.days>=300?'整个赛季':r.days+' 天'}。`}); }
    });
  });
  const bs=E.boxScore(M);
  if(hIdx===G.team || aIdx===G.team) S.boxes[gameRef.key]={h:hIdx,a:aIdx,score:M.score.slice(),q:M.qScore,ot:M.ot,box:bs.map(t=>({pts:t.pts,st:t.st,system:t.system,fit:t.fit,players:t.players.map(p=>{ const o={id:p.id}; PS_KEYS.forEach(k=>o[k]=k==='min'?Math.round(p.min*10)/10:p[k]); o.starter=p.starter; o.inj=p.inj; o.gs=p.gs; return o; })}))};
}
function simGame(hIdx, aIdx, gameRef, playoff){
  const S=G.season;
  const M=E.createMatch(sideFor(hIdx), sideFor(aIdx), {seed:(S.seed*31+gameRef.n*977)>>>0});
  E.run(M); recordGame(M,hIdx,aIdx,gameRef,playoff); return M;
}

// ---------- 推进一天 ----------
function todays(){ const S=G.season; return S.games.map((g,n)=>({g,n})).filter(x=>x.g[0]===S.day && x.g[3]==null); }
function userGameToday(){ const S=G.season;
  if(S.phase==='reg'){ const r=todays().find(x=>x.g[1]===G.team||x.g[2]===G.team); if(r && r.g[6]==='cup') r.label='常规赛 · NBA 杯小组赛'; return r || cupGamesToday().find(x=>x.h===G.team||x.a===G.team) || null; }
  const pg=poGamesToday(); return pg.find(x=>x.h===G.team||x.a===G.team)||null; }

// 模拟当天除玩家以外的比赛；玩家比赛按 mode：'skip' 直接出结果，M 由直播传入
function playDay(userM){
  const S=G.season; applyPlayerState();
  if(S.phase==='reg'){
    todays().forEach(({g,n})=>{
      let M;
      if((g[1]===G.team||g[2]===G.team) && userM) { M=userM; recordGame(M,g[1],g[2],{n,key:'r'+n},false); }
      else M=simGame(g[1],g[2],{n,key:'r'+n},false);
      g[3]=M.score[0]; g[4]=M.score[1]; g[5]=M.ot;
    });
    cupGamesToday().forEach(x=>{
      let M;
      if((x.h===G.team||x.a===G.team) && userM){ M=userM; recordGame(M,x.h,x.a,{n:x.n,key:x.key},'cup'); }
      else M=simGame(x.h,x.a,{n:x.n,key:x.key},'cup');
      x.done(M.score[0],M.score[1],M.ot);
    });
  } else if(S.phase==='playin' || S.phase==='po'){
    poGamesToday().forEach(x=>{
      let M;
      if((x.h===G.team||x.a===G.team) && userM){ M=userM; recordGame(M,x.h,x.a,{n:x.n,key:x.key},true); }
      else M=simGame(x.h,x.a,{n:x.n,key:x.key},true);
      x.done(M.score[0],M.score[1],M.ot);
    });
  }
  endDay();
}
function endDay(){
  const S=G.season;
  // 伤病倒计时、体能恢复
  Object.keys(S.inj).forEach(id=>{ S.inj[id].days--; if(S.inj[id].days<=0){ const p=PBYID[id]; delete S.inj[id];
    if(p && teamOfPlayer(p)===G.team) S.inbox.push({d:S.day, t:`${p.cn} 伤愈`, b:'可以重新上场了。'}); } });
  { const tmap=teamMapOfPlayers(); Object.keys(S.cond).forEach(id=>{ S.cond[id]=Math.min(100,S.cond[id]+dailyRecover(tmap[id]==null?-1:tmap[id])); }); }
  // AI 交易：截止日前每天 3% 概率；AI 给玩家的报价 4%
  if(S.phase==='reg'){ const dl=dayOf(new Date(S.year+1,1,5));
    if(S.day<=dl){ if(rnd01()<.05) tryAITrade(); maybeUserOffer(.04); }
    if(S.day===dl) addNews('截止日',`${S.year+1} 年交易截止日已过，这个赛季不能再交易了。`); }
  S.day++;
  // 每周士气和化学反应，每两周成长；全明星周末；NBA 杯
  if(S.phase!=='done' && S.day%7===0) weeklyLife();
  if(S.phase==='reg' && S.day%14===0) growthTick();
  if(S.phase==='reg' && S.day>=ASB[0] && S.day<=ASB[1] && !S.allStar) runAllStar();
  cupDaily(S);
  // 月度：老板信任度
  const mo=dateOf(S.day).getMonth();
  if(S.phase==='reg' && mo!==S.lastMonth){ S.lastMonth=mo; monthlyBoard(); }
  // 阶段切换
  if(S.phase==='reg' && S.games.every(g=>g[3]!=null)) endRegular();
  else if(S.phase==='playin' && S.playin.every(x=>x.w!=null) && S.playin.length===6) startPlayoffs();
  else if(S.phase==='playin') advancePlayin();
  else if(S.phase==='po') advancePlayoffs();
  applyPlayerState(); saveSeason();
}
function teamOfPlayer(p){ return TEAMS.findIndex(t=>t.players.includes(p)); }

// ---------- 战绩 ----------
function standings(){
  const S=G.season, R=TEAMS.map(t=>({i:t.i,w:0,l:0,hw:0,hl:0,aw:0,al:0,cw:0,cl:0,pf:0,pa:0,last:[],h2h:{}}));
  S.games.forEach(g=>{ if(g[3]==null) return; const [d,h,a,hs,as]=g; const hW=hs>as;
    const H=R[h],A=R[a]; H.pf+=hs;H.pa+=as;A.pf+=as;A.pa+=hs;
    if(hW){H.w++;H.hw++;A.l++;A.al++;} else {A.w++;A.aw++;H.l++;H.hl++;}
    if(TEAMS[h].conf===TEAMS[a].conf){ if(hW){H.cw++;A.cl++;} else {A.cw++;H.cl++;} }
    H.last.push(hW?'W':'L'); A.last.push(hW?'L':'W');
    H.h2h[a]=(H.h2h[a]||0)+(hW?1:-1); A.h2h[h]=(A.h2h[h]||0)+(hW?-1:1); });
  R.forEach(r=>{ r.g=r.w+r.l; r.pct=r.g?r.w/r.g:0; let s=0; for(let k=r.last.length-1;k>=0;k--){ if(r.last[k]===r.last[r.last.length-1]) s++; else break; }
    r.streak=r.last.length?(r.last[r.last.length-1]==='W'?'连胜 ':'连败 ')+s:'-'; r.l10=r.last.slice(-10); });
  return R;
}
function confRank(R, cf){
  const arr=R.filter(r=>TEAMS[r.i].conf===cf);
  arr.sort((x,y)=> y.pct-x.pct || (y.h2h[x.i]||0)-(x.h2h[y.i]||0) || (y.cw-y.cl)-(x.cw-x.cl) || (y.pf-y.pa)-(x.pf-x.pa));
  const top=arr[0]; arr.forEach(r=>r.gb=((top.w-r.w)+(r.l-top.l))/2);
  return arr;
}

// ---------- 老板 ----------
function monthlyBoard(){
  const S=G.season, r=standings()[G.team]; if(r.g<8) return;
  const diff=r.pct-GOALS[S.board.tier].exp;
  const delta=Math.round(clamp(diff*40,-8,8));
  S.board.conf=clamp(S.board.conf+delta,0,100);
  S.inbox.push({d:S.day, t:'老板的月度评价', b:`目前 ${r.w} 胜 ${r.l} 负。${delta>2?'老板对球队的表现很满意。':delta<-2?'老板对战绩不太满意，希望尽快改善。':'老板觉得还行，继续保持。'}信任度 ${S.board.conf}（${delta>=0?'+':''}${delta}）。${finMonthlyNote()}`});
  checkFired();
}
function checkFired(){ const S=G.season; if(S.board.conf<15 && !S.fired){ S.fired=true; S.inbox.push({d:S.day,t:'你被解雇了',b:'老板对球队失去了信心，决定换帅。你可以接手另一支球队重新开始。'}); } }

// ---------- 常规赛结束：奖项、附加赛 ----------
function endRegular(){
  const S=G.season; settleTax(); const R=standings();
  S.final=R.map(r=>({i:r.i,w:r.w,l:r.l}));
  S.seeds={东:confRank(R,'东').map(r=>r.i), 西:confRank(R,'西').map(r=>r.i)};
  S.awards=calcAwards(R);
  S.inbox.push({d:S.day,t:'常规赛结束',b:`常规赛 MVP：${PBYID[S.awards.mvp].cn}。最佳防守球员：${PBYID[S.awards.dpoy].cn}。最佳新秀：${S.awards.roy?PBYID[S.awards.roy].cn:'无'}。最佳第六人：${S.awards.smoy?PBYID[S.awards.smoy].cn:'无'}。`});
  S.phase='playin'; S.playin=[]; S.day+=2; S.poDay=S.day;
  ['东','西'].forEach(cf=>{ const s=S.seeds[cf];
    S.playin.push({cf, tag:'7v8', h:s[6], a:s[7], day:S.day, w:null});
    S.playin.push({cf, tag:'9v10', h:s[8], a:s[9], day:S.day, w:null}); });
}
function advancePlayin(){
  const S=G.season;
  ['东','西'].forEach(cf=>{
    const g78=S.playin.find(x=>x.cf===cf&&x.tag==='7v8'), g910=S.playin.find(x=>x.cf===cf&&x.tag==='9v10');
    if(g78.w!=null && g910.w!=null && !S.playin.find(x=>x.cf===cf&&x.tag==='last')){
      const l78=g78.w===g78.h?g78.a:g78.h;
      S.playin.push({cf, tag:'last', h:l78, a:g910.w, day:S.day+1, w:null});
    }
  });
}
function calcAwards(R){
  const S=G.season, pct=i=>R[i].pct;
  let best={}; const upd=(k,id,v)=>{ if(!best[k]||v>best[k].v) best[k]={id,v}; };
  Object.entries(S.ps).forEach(([id,q])=>{
    if(q.g<55) return; const p=PBYID[id]; const g=q.g, t=q.team;
    const per=k=>q[k]/g;
    const base=per('pts')+1.1*(per('oreb')+per('dreb'))+1.4*per('ast')+2*per('stl')+2*per('blk')-per('tov')-.4*(per('fga')-per('fgm'));
    upd('mvp',id,base*(0.55+pct(t)));
    upd('dpoy',id,(2.2*per('stl')+2.6*per('blk')+.35*per('dreb'))*(0.7+pct(t)*.6)+p.a.perD/40+p.a.intD/40);
    if(p.age<=21 && p.contract && p.contract[2]==='rk') upd('roy',id,base);
    if(q.gs<q.g*.25) upd('smoy',id,base);
  });
  return {mvp:best.mvp&&best.mvp.id, dpoy:best.dpoy&&best.dpoy.id, roy:best.roy&&best.roy.id, smoy:best.smoy&&best.smoy.id};
}

// ---------- 季后赛 ----------
function startPlayoffs(){
  const S=G.season;
  const seeds={};
  ['东','西'].forEach(cf=>{ const s=S.seeds[cf].slice(0,6);
    const g78=S.playin.find(x=>x.cf===cf&&x.tag==='7v8'), last=S.playin.find(x=>x.cf===cf&&x.tag==='last');
    s.push(g78.w, last.w); seeds[cf]=s; });
  S.poSeeds=seeds;
  const mk=(cf,a,b,round,slot)=>({cf,round,slot,h:a,a:b,hw:0,aw:0,games:[],w:null});
  S.po={round:1, series:[]};
  ['东','西'].forEach(cf=>{ const s=seeds[cf]; [[0,7],[3,4],[2,5],[1,6]].forEach(([x,y],k)=>S.po.series.push(mk(cf,s[x],s[y],1,k))); });
  S.phase='po'; S.poDay=S.day+1;
  const inPo = Object.values(seeds).some(s=>s.includes(G.team));
  S.inbox.push({d:S.day,t:'季后赛对阵出炉',b: inPo? `你的球队以${(seeds[TEAMS[G.team].conf].indexOf(G.team)+1)}号种子进入季后赛。` : '你的球队没能进入季后赛。可以继续模拟，看看谁拿总冠军。'});
}
function seriesSeedRank(sr){ // 主场优势：战绩更好的一方
  const S=G.season, f=i=>S.final.find(x=>x.i===i); const A=f(sr.h), B=f(sr.a);
  return (A.w-A.l)>=(B.w-B.l);
}
function poGamesToday(){
  const S=G.season, out=[];
  if(S.phase==='playin'){
    S.playin.forEach((x,k)=>{ if(x.w==null && x.day===S.day) out.push({h:x.h,a:x.a,n:5000+k,key:'pi'+k,label:`附加赛 ${x.cf}部 ${x.tag==='7v8'?'7 号 vs 8 号':x.tag==='9v10'?'9 号 vs 10 号':'争夺 8 号种子'}`,done:(hs,as)=>{ x.w=hs>as?x.h:x.a; x.score=[hs,as]; }}); });
    return out;
  }
  if(S.phase!=='po' || S.day<S.poDay) return out;
  S.po.series.filter(sr=>sr.round===S.po.round && sr.w==null).forEach((sr,k)=>{
    const gn=sr.games.length; const higher=seriesSeedRank(sr)?sr.h:sr.a, lower=higher===sr.h?sr.a:sr.h;
    const homeHigher=[0,1,4,6].includes(gn);
    const h=homeHigher?higher:lower, a=homeHigher?lower:higher;
    out.push({h,a,n:6000+S.po.round*100+sr.slot*10+(sr.cf==='西'?50:0)+gn, key:`po${S.po.round}${sr.cf}${sr.slot}g${gn}`,
      label:`${['','首轮','分区半决赛','分区决赛','总决赛'][sr.round]} 第 ${gn+1} 场`, series:sr,
      done:(hs,as)=>{ const w=hs>as?h:a; if(w===sr.h) sr.hw++; else sr.aw++; sr.games.push({h,a,hs,as}); if(sr.hw===4||sr.aw===4) sr.w=sr.hw===4?sr.h:sr.a; }});
  });
  return out;
}
function advancePlayoffs(){
  const S=G.season, cur=S.po.series.filter(sr=>sr.round===S.po.round);
  if(cur.some(sr=>sr.w==null)) return;
  if(S.po.round===4){ const fin=cur[0]; S.champion=fin.w; S.phase='done'; finishSeason(); return; }
  const nr=S.po.round+1; S.po.round=nr; S.poDay=S.day+1;
  if(nr<=3){ ['东','西'].forEach(cf=>{ const prev=S.po.series.filter(sr=>sr.round===nr-1&&sr.cf===cf).sort((a,b)=>a.slot-b.slot);
      for(let k=0;k<prev.length;k+=2) S.po.series.push({cf,round:nr,slot:k/2,h:prev[k].w,a:prev[k+1].w,hw:0,aw:0,games:[],w:null}); }); }
  else { const e=S.po.series.find(sr=>sr.round===3&&sr.cf==='东'), w=S.po.series.find(sr=>sr.round===3&&sr.cf==='西');
    S.po.series.push({cf:'总',round:4,slot:0,h:e.w,a:w.w,hw:0,aw:0,games:[],w:null}); }
  const mine=S.po.series.find(sr=>sr.round===nr&&(sr.h===G.team||sr.a===G.team));
  if(mine) S.inbox.push({d:S.day,t:`晋级${['','','分区半决赛','分区决赛','总决赛'][nr]}`,b:`下一轮对手：${TEAMS[mine.h===G.team?mine.a:mine.h].cn}。`});
}
function userPoResult(){ // 玩家在季后赛走到哪
  const S=G.season; if(!S.po) return S.playin&&S.playin.some(x=>x.h===G.team||x.a===G.team)?'附加赛出局':'未进季后赛';
  if(S.champion===G.team) return '总冠军';
  const mine=S.po.series.filter(sr=>sr.h===G.team||sr.a===G.team);
  if(!mine.length) return S.playin&&S.playin.some(x=>x.h===G.team||x.a===G.team)?'附加赛出局':'未进季后赛';
  const r=Math.max(...mine.map(sr=>sr.round));
  const lost=mine.find(sr=>sr.round===r && sr.w!=null && sr.w!==G.team);
  return lost? ['','首轮出局','分区半决赛出局','分区决赛出局','总决赛失利'][r] : ['','首轮','分区半决赛','分区决赛','总决赛'][r]+'进行中';
}
function finishSeason(){
  const S=G.season, r=S.final.find(x=>x.i===G.team), res=userPoResult();
  const roundWon = res==='总冠军'?5 : res==='总决赛失利'?4 : res==='分区决赛出局'?3 : res==='分区半决赛出局'?2 : res==='首轮出局'?1 : 0;
  const inPO = roundWon>=1 || S.po.series.some(sr=>sr.h===G.team||sr.a===G.team);
  const seed = S.seeds[TEAMS[G.team].conf].indexOf(G.team)+1;
  let met;
  switch(S.board.tier){
    case 0: met = roundWon>=4; break;
    case 1: met = roundWon>=2; break;
    case 2: met = inPO; break;
    case 3: met = seed<=10; break;
    default: { const young=Object.entries(S.ps).some(([id,q])=>q.team===G.team && PBYID[id].age<=23 && q.g>=40 && q.min/q.g>=20); met = r.w>=25 && young; }
  }
  const exceed = met && (roundWon>=({0:5,1:3,2:2,3:1,4:1})[S.board.tier]);
  // 差一点完成：只差一轮（或者差一档）
  const close = !met && ({0:roundWon===3, 1:roundWon===1, 2:seed<=10, 3:seed<=12, 4:r.w>=20})[S.board.tier];
  const delta = exceed?25 : met?15 : close?-8 : -18;
  S.board.conf=clamp(S.board.conf+delta,0,100);
  const fe=financeSeasonEnd(), ff=fe.f;
  if(!fe.pen && fe.first && ff.spend>ff.limit) S.inbox.push({d:S.day, t:'老板提醒开支', b:`工资加奢侈税一共 ${money(ff.spend)}，超出老板能接受的 ${money(ff.limit)}。这些合同是前任签的，今年不追究；从下个赛季起，超出的部分会扣信任度。`});
  if(fe.pen){ S.board.conf=clamp(S.board.conf-fe.pen,0,100); S.inbox.push({d:S.day, t:'老板对开支不满', b:`工资加奢侈税一共 ${money(ff.spend)}，超出老板能接受的 ${money(ff.limit)}。信任度 −${fe.pen}。`}); }
  S.userFinal={w:r.w,l:r.l,res,met,exceed,delta,seed,finPen:fe.pen};
  S.inbox.push({d:S.day,t: S.champion===G.team?'总冠军！':'赛季结束', b:`${TEAMS[S.champion].cn} 拿下总冠军。你的球队：${r.w} 胜 ${r.l} 负，${res}。老板目标「${GOALS[S.board.tier].txt}」${met?(exceed?'超额完成':'完成'):close?'差一点完成':'没有完成'}，信任度 ${delta>0?'+':''}${delta}，现在 ${S.board.conf}。`});
  G.career=G.career||[];
  G.career.push({year:S.year, team:G.team, w:r.w, l:r.l, res, champ:S.champion===G.team, cup:!!(S.cup&&S.cup.champ===G.team), goal:GOALS[S.board.tier].name, met, fmvp:null, mvp:S.awards&&S.awards.mvp, fin:{revT:ff.revT, pay:ff.pay, tax:ff.tax, profit:ff.profit}});
  G.board={conf:S.board.conf};
  checkFired(); save();
}

function nextUserGame(){

  const t=userGameToday(); if(t) return {key:t.key, day:S.day, home:t.h===G.team, opp:t.h===G.team?t.a:t.h, label:t.label};

let BUSY=false;
function afterDay(){ if(G.season.fired){ G.view='home'; } render(); }
async function advance(mode){
  if(BUSY||LIVE) return; const S=G.season; BUSY=true;
  const startDay=S.day, prog=document.getElementById('advprog');
  try{
    for(let guard=0; guard<500; guard++){
      if(S.phase==='done' || S.fired) break;
      if(userGameToday() && (mode==='day' || mode==='next' || !G.autoMine)) break;   // 轮到自己的比赛就停下
      playDay(null);
      if(prog) prog.textContent='模拟到 '+dateTxt(S.day);
      if(mode==='day') break;
      if(mode==='next' && userGameToday()) break;
      if(mode==='week' && S.day-startDay>=7) break;
      if(mode==='regular' && S.phase!=='reg') break;
      if(guard%2===0) await new Promise(r=>setTimeout(r,0));
    }
  } finally { BUSY=false; }
  afterDay();
}

const rnd01=Math.random;
function gauss(m,s){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

const PHYS=['spd','jmp','str','sta'], SKILL=['three','ft','mid','pass','oiq','diq','handle','post'];

function progressPlayer(p, age, ti, mm){
  // 全年成长的六成在这里结算，另外四成在赛季里每两周结算（第五阶段）；年轻人再乘上场时间系数（第六阶段）
  let d=growthBase(p,age); d*=.6*trainMul(ti==null?-1:ti,d); if(d>0 && age<=24) d*=(mm||1);
  d+=gauss(0,1.5);
  if(d>0 && p.ovr+d>p.pot) d=Math.max(0,p.pot-p.ovr);
  const target=clamp(Math.round(p.ovr+d),30,99), old=p.ovr;
  // 分摊到属性
  const old30=age>=30;
  KEYS.forEach(k=>{ let w=1; if(PHYS.includes(k)) w= d<0&&old30?1.6 : d>0?.6:1; if(SKILL.includes(k)) w= d<0&&old30?.6 : d>0?1.25:1;
    p.a[k]=clamp(Math.round(p.a[k]+d*w*1.1+gauss(0,1)),20,99); });
  // 微调到目标总评
  fitOvr(p, target);
  p.ovr=calcOvr(p);
  // 潜力
  if(age<25) p.pot=Math.round(clamp(p.pot+potDrift(p,age),p.ovr,99));
  else p.pot=Math.max(p.ovr, Math.round(p.pot-(p.pot-p.ovr)*.5));
  p.dur=clamp(Math.round(p.dur - (age>=31?rnd01()*3:0) + gauss(0,1.5)),30,99);
  return p.ovr-old;
}
function fitOvr(p, target){ // 把属性整体推到目标总评
  for(let it=0; it<400; it++){ const cur=calcOvr(p); if(cur===target) break; const dir=cur<target?1:-1;
    let moved=false; KEYS.forEach(k=>{ if(rnd01()<.6){ const v=clamp(p.a[k]+dir,20,99); if(v!==p.a[k]){ p.a[k]=v; moved=true; } } }); if(!moved) break; }

}
function retireProb(p, age){

  if(age>=30 && p.ovr<65) r+=.3;
  if(!p.contract && p.ovr<66 && age>=30) r+=.5;
  return Math.min(1,r);
}

  all.forEach(([p,ti])=>{
    const age=ageOf(p,nextYear); const old=p.ovr; const q=S.ps[p.id], mpg=q?q.min/82:0; const d=progressPlayer(p,age,ti,ti>=0?minMul(mpg,p.contract&&p.contract[2]==='tw'):.9); p.age=age; delete p.gx;

  });
  rep.risers.sort((a,b)=>(b.now-b.old)-(a.now-a.old)); rep.fallers=rep.risers.slice(-8).reverse(); rep.risers=rep.risers.slice(0,8);
  // 退役：从队里拿掉，剩余合同不计死钱
  TEAMS.forEach(t=>{ t.players=t.players.filter(p=>!p._retire); });
  for(let i=FREE.length-1;i>=0;i--) if(FREE[i]._retire) FREE.splice(i,1);
  rep.retired.sort((a,b)=>b.old-a.old);
  // 伤病清零（休赛期养好了）
  TEAMS.forEach(t=>t.players.forEach(p=>{ p.injury=0; p.energy=1; }));
  reindex();

}
